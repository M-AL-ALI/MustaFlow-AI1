            application/json:
              schema:
                type: object
                required: [ran]
                properties:
                  ran: { type: boolean }
                additionalProperties: true

  # ── Purchased domains (Namecheap reseller) ───────────────────────────────────

  /domains/search:
    get:
      operationId: searchPurchaseableDomains
      tags: [domains]
      summary: Check availability and price for a domain name across top TLDs
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainSearchResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /domains/purchased:
    get:
      operationId: listPurchasedDomains
      tags: [domains]
      summary: List all purchased domains for the authenticated user
      responses:
        "200":
          description: Purchased domain list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainsResponse"

  /domains/purchase:
    post:
      operationId: purchaseDomain
      tags: [domains]
      summary: Initiate a domain purchase (returns Stripe Checkout URL or PaymentIntent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseDomainInput"
      responses:
        "200":
          description: Purchase initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseDomainResponse"
        "400":
          description: Invalid hostname
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Domain unavailable or already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /domains/purchase/confirm:
    post:
      operationId: confirmDomainPurchase
      tags: [domains]
      summary: Finalize a domain purchase after Stripe payment succeeds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPurchaseInput"
      responses:
        "200":
          description: Domain registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"
        "402":
          description: Payment not completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /domains/transfer-in:
    post:
      operationId: initiateDomainTransfer
      tags: [domains]
      summary: Initiate an inbound domain transfer (returns Stripe Checkout URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferDomainInput"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferDomainResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Domain already in account or not transferable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /domains/transfer-in/confirm:
    post:
      operationId: confirmDomainTransfer
      tags: [domains]
      summary: Finalize an inbound domain transfer after Stripe payment succeeds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTransferInput"
      responses:
        "201":
          description: Transfer submitted to Namecheap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"

  /domains/purchased/{id}:
    get:
      operationId: getPurchasedDomain
      tags: [domains]
      summary: Get a single purchased domain by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Domain detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /domains/purchased/{id}/auto-renew:
    patch:
      operationId: setPurchasedDomainAutoRenew
      tags: [domains]
      summary: Toggle auto-renew on a purchased domain
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoRenew]
              properties:
                autoRenew: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"

  /domains/purchased/{id}/whois:
    patch:
      operationId: updatePurchasedDomainWhois
      tags: [domains]
      summary: Update WHOIS contact information for a purchased domain
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhoisContactUpdate"
      responses:
        "200":
          description: WHOIS updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"

  /domains/purchased/{id}/renew:
    post:
      operationId: renewPurchasedDomain
      tags: [domains]
      summary: Manually renew a purchased domain (returns Stripe Checkout URL)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                successUrl: { type: string }
                cancelUrl: { type: string }
      responses:
        "200":
          description: Renewal initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenewDomainResponse"

  /domains/purchased/{id}/renew/confirm:
    post:
      operationId: confirmPurchasedDomainRenewal
      tags: [domains]
      summary: Finalize a manual renewal after Stripe payment succeeds
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentIntentId: { type: string }
                sessionId: { type: string }
      responses:
        "200":
          description: Renewal completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"

  /domains/purchased/{id}/auth-code:
    get:
      operationId: getPurchasedDomainAuthCode
      tags: [domains]
      summary: Retrieve the EPP auth code for transfer-out
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Auth code
          content:
            application/json:
              schema:
                type: object
                required: [hostname, authCode]
                properties:
                  hostname: { type: string }
                  authCode: { type: ["string", "null"] }

  /domains/purchased/{id}/release:
    post:
      operationId: releasePurchasedDomain
      tags: [domains]
      summary: Release a purchased domain (unlock registrar lock for transfer-out)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                type: object
                required: [domain]
                properties:
                  domain: { $ref: "#/components/schemas/PurchasedDomain" }
                  note: { type: string }

  /domains/purchased/{id}/project:
    patch:
      operationId: attachPurchasedDomainToProject
      tags: [domains]
      summary: Attach or detach a purchased domain from a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: ["integer", "null"]
                  description: "Project to attach to, or null to detach."
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasedDomainResponse"

  /domains/purchased/{id}/info:
    get:
      operationId: refreshPurchasedDomainInfo
      tags: [domains]
      summary: Refresh domain info from Namecheap (expiry, NS, status)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Refreshed info
          content:
            application/json:
              schema:
                type: object
                required: [domain]
                properties:
                  domain: { $ref: "#/components/schemas/PurchasedDomain" }
                  namecheapInfo:
                    type: object
                    nullable: true
                    additionalProperties: true

  # ── Public REST API v1 ────────────────────────────────────────────────────────
  # All v1 routes accept Bearer PAT or a Clerk session cookie.

  /v1/projects:
    get:
      operationId: v1ListProjects
      tags: [v1]
      summary: List all projects owned by the caller
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/V1Project" }
                  total: { type: integer }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: v1CreateProject
      tags: [v1]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V1CreateProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/V1Project" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}:
    get:
      operationId: v1GetProject
      tags: [v1]
      summary: Get a single project by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/V1Project" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}/builds:
    get:
      operationId: v1ListBuilds
      tags: [v1]
      summary: List builds (AI tasks) for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Build list
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/V1Build" }
                  total: { type: integer }
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: v1TriggerBuild
      tags: [v1]
      summary: Trigger a new AI build for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: Natural language description of what to build or change
                  maxLength: 2000
      responses:
        "202":
          description: Build accepted (started or queued)
          content:
            application/json:
              schema:
                type: object
                properties:
                  build: { $ref: "#/components/schemas/V1Build" }
                  queued: { type: boolean }
                  message: { type: string }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}/builds/{buildId}:
    get:
      operationId: v1GetBuild
      tags: [v1]
      summary: Poll the status of a specific build
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: buildId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Build status
          content:
            application/json:
              schema:
                type: object
                properties:
                  build: { $ref: "#/components/schemas/V1Build" }
        "404":
          description: Build or project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}/builds/{buildId}/cancel:
    post:
      operationId: v1CancelBuild
      tags: [v1]
      summary: Cancel an in-progress or queued build
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: buildId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  buildId: { type: integer }
        "404":
          description: Build or project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Build is not cancellable in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}/files:
    get:
      operationId: v1ListFiles
      tags: [v1]
      summary: List all generated files for a project (metadata only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/V1FileMeta" }
                  total: { type: integer }
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{id}/files/{path}:
    get:
      operationId: v1DownloadFile
      tags: [v1]
      summary: Download a generated file by its path
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: path,
            in: path,
            required: true,
            schema: { type: string },
            description: "File path within the project (e.g. index.html or src/App.tsx)",
          }
      responses:
        "200":
          description: Raw file content with correct Content-Type header
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File or project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /brainstorm/chat:
    post:
      operationId: brainstormChat
      tags: [brainstorm]
      summary: Send a message to the brainstorm AI ideation assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainstormChatInput"
      responses:
        "200":
          description: AI reply and build-intent flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainstormChatOutput"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: AI service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /brainstorm/resolve:
    post:
      operationId: brainstormResolve
      tags: [brainstorm]
      summary: Resolve a brainstorm conversation into a structured project spec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainstormResolveInput"
      responses:
        "200":
          description: Resolved project name, prompt, and kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainstormResolveOutput"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /images/generate:
    post:
      summary: Enqueue an async image generation job
      operationId: enqueueImageGeneration
      tags: [Images]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerateRequest"
      responses:
        "202":
          description: Job accepted — poll /images/status/{jobId} for result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerateResponse"
        "400":
          {
            description: Bad request,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "402":
          {
            description: Insufficient credits,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "422":
          {
            description: Prompt blocked by safety validation,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "429":
          {
            description: Rate limit exceeded,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "503":
          {
            description: Provider not configured,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

  /images/status/{jobId}:
    get:
      summary: Poll image generation job status
      operationId: getImageJobStatus
      tags: [Images]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageStatusResponse"
        "404":
          {
            description: Job not found,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

  /images:
    get:
      summary: List the authenticated user's generated images
      operationId: listImages
      tags: [Images]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: projectId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"

  /images/{id}:
    get:
      summary: Get a single generated image by ID
      operationId: getGeneratedImage
      tags: [Images]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The image record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          {
            description: Not found,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
    delete:
      summary: Soft-delete a generated image
      operationId: deleteGeneratedImage
      tags: [Images]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "404":
          {
            description: Not found,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

  /images/upload:
    post:
      summary: Upload a user image to Image Studio
      operationId: uploadImage
      tags: [Images]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          {
            description: Bad request,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "413":
          {
            description: File too large,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "415":
          {
            description: Unsupported file type,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

  /images/{id}/edit:
    post:
      summary: Edit an existing image with AI
      operationId: editImage
      tags: [Images]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageEditRequest"
      responses:
        "202":
          description: Edit job enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerateResponse"
        "402":
          {
            description: Insufficient credits,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "404":
          {
            description: Image not found,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }
        "422":
          {
            description: Safety blocked or image not editable,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

  /help/articles:
    get:
      operationId: listHelpArticles
      tags: [help]
      summary: List/search public Help Center articles and FAQs.
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Optional free-text search across title, body, and tags.
        - in: query
          name: category
          required: false
          schema: { type: string }
          description: Optional category filter.
      responses:
        "200":
          description: Help articles and FAQs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticlesOutput"

  /help/support/chat:
    post:
      operationId: supportChat
      tags: [help]
      summary: Send a message to Ora Support Mode (requires sign-in).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChatInput"
      responses:
        "200":
          description: Support assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChatOutput"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /help/support/conversations:
    get:
      operationId: listSupportConversations
      tags: [help]
      summary: List the signed-in user's Support Mode conversations.
      responses:
        "200":
          description: Support conversation summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversationsOutput"
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /help/support/conversations/{id}:
    get:
      operationId: getSupportConversation
      tags: [help]
      summary: Read a single Support Mode conversation's full message history (owner-scoped).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Support conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversationDetail"
        "400":
          description: Invalid conversation id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Conversation not found or not owned by the requester
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /help/support/tickets:
    get:
      operationId: listSupportTickets
      tags: [help]
      summary: List the signed-in user's own support tickets.
      responses:
        "200":
          description: Support ticket summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketsOutput"
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /help/support/tickets/{id}:
    get:
      operationId: getSupportTicket
      tags: [help]
      summary: Read a single support ticket (only when it belongs to the requester).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Support ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "400":
          description: Invalid ticket id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Ticket not found or not owned by the requester
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /help/support/escalate:
    post:
      operationId: escalateSupport
      tags: [help]
      summary: Escalate a support conversation to a human (creates a ticket + email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateSupportInput"
      responses:
        "201":
          description: Ticket created (email attempted after persistence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalateSupportOutput"
        "400":
          description: Invalid request body or attachment validation failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        containerSubsystem:
          type: string
          enum: [unknown, ok, unconfigured, partial-config, error]
          description: >
            Status of the Fly.io container subsystem.
            "unknown" = the startup check has not completed yet.
            "ok" = token is configured and API is reachable.
            "unconfigured" = FLY_API_TOKEN is not set (feature disabled, not an error).
            "partial-config" = the selected runtime provider configuration is incomplete.
            "error" = token is set but API call failed at startup.
        encryptionKey:
          type: string
          enum: [ok, missing, invalid]
          description: >
            Encryption key health. "ok" = key is present and AES-256-GCM round-trip passes.
            "missing" = ENCRYPTION_KEY is not set (falls back to plaintext in dev, crashes in prod).
            "invalid" = key is set but validation failed (wrong length, bad base64, or round-trip mismatch).
        startupMigrations:
          type: string
          enum: [unknown, ok, error]
          description: >
            Cached startup-migration state. "unknown" = migrations have not completed yet.
            "ok" = every migration passed. "error" = one or more migrations failed.
        queueSchemaContract:
          type: string
          enum: [unknown, ok, error]
          description: >
            Cached Zero prompt queue schema-contract state. "unknown" = the first verification
            has not completed yet. "ok" = the contract is ready. "error" = the contract is unready.
        buildCommit:
          type: string
          pattern: "^(unknown|[0-9a-f]{40})$"
          description: Exact commit of the serving API build, or "unknown" when build-info is unavailable.
        missingRuntimeBindings:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Required runtime binding names absent from a partial provider configuration.
          items:
            type: string
            enum:
              - CLOUDFLARE_RUNTIME_CONTROL_URL
              - CLOUDFLARE_RUNTIME_CONTROL_TOKEN
              - CLOUDFLARE_RUNTIME_DEPLOYMENT_NAMESPACE
              - FLY_API_TOKEN
              - FLY_APP_NAME
              - FLY_ORG_SLUG
              - FLY_REGION
      required:
        [
          status,
          containerSubsystem,
          encryptionKey,
          startupMigrations,
          queueSchemaContract,
          buildCommit,
        ]

    ServedBuildIdentity:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            commit: { type: string, pattern: "^[0-9a-f]{40}$" }
            tree: { type: string, pattern: "^[0-9a-f]{40}$" }
            builtAt: { type: string, format: date-time }
          required: [commit, tree, builtAt]
        - type: object
          additionalProperties: false
          properties:
            identity: { type: string, enum: [unknown] }
          required: [identity]

    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    NabuflowPlan:
      type: object
      required:
        [
          id,
          name,
          available,
          includedMonthlyCredits,
          overageUsdPerCredit,
          rolloverCycles,
          rolloverMaxCredits,
          parallelBuildLimit,
          queuePriority,
          defaultSpendCapUsdCents,
          maxSpendCapUsdCents,
          ladder,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        available: { type: boolean }
        priceUsd: { type: number, nullable: true }
        includedMonthlyCredits: { type: integer }
        overageUsdPerCredit: { type: number }
        rolloverCycles: { type: integer }
        rolloverMaxCredits: { type: integer }
        parallelBuildLimit: { type: integer }
        queuePriority: { type: integer }
        defaultSpendCapUsdCents: { type: integer }
        maxSpendCapUsdCents: { type: integer }
        ladder:
          type: object
          required: [proDeepCombo]
          properties:
            proBuildsPerCycle: { type: integer, nullable: true }
            deepBuildsPerCycle: { type: integer, nullable: true }
            proDeepCombo: { type: boolean }

    NabuflowUsageEvent:
      type: object
      required:
        [
          id,
          cycleId,
          source,
          deepReasoning,
          credits,
          includedCredits,
          overageCredits,
          overageUsdCents,
          usdValueCents,
          attribution,
        ]
      properties:
        id: { type: integer }
        cycleId: { type: integer, nullable: true }
        orgId: { type: integer, nullable: true }
        projectId: { type: integer, nullable: true }
        taskId: { type: integer, nullable: true }
        source: { type: string }
        engineMode: { type: string, nullable: true }
        deepReasoning: { type: boolean }
        credits: { type: integer }
        includedCredits: { type: integer }
        overageCredits: { type: integer }
        overageUsdCents: { type: integer }
        usdValueCents: { type: integer }
        attribution: { type: string }
        description: { type: string, nullable: true }
        reversedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    NabuflowOrg:
      type: object
      description: >
        Constellation enterprise organization — the company entity that owns
        the shared credit pool. Monetary fields are USD cents; poolCredits is
        the prepaid shared balance that seats draw builds from.
      required:
        [
          id,
          companyName,
          billingContactEmail,
          addressLine1,
          city,
          postalCode,
          country,
          invoiceTermsEnabled,
          termsNetDays,
          status,
          poolCredits,
          effectiveSpendCapUsdCents,
        ]
      properties:
        id: { type: integer }
        companyName: { type: string }
        billingContactName: { type: string, nullable: true }
        billingContactEmail: { type: string }
        taxId: { type: string, nullable: true }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        city: { type: string }
        region: { type: string, nullable: true }
        postalCode: { type: string }
        country: { type: string }
        poReference: { type: string, nullable: true }
        invoiceTermsEnabled: { type: boolean }
        termsNetDays: { type: integer }
        status: { type: string }
        poolCredits: { type: integer }
        monthlySpendCapUsdCents: { type: integer, nullable: true }
        effectiveSpendCapUsdCents: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true }

    NabuflowOrgSeat:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string }
        email: { type: string, nullable: true }
        seatSpendCapUsdCents: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    NabuflowOrgPurchase:
      type: object
      required: [id, credits, amountUsdCents, method, status]
      properties:
        id: { type: integer }
        credits: { type: integer }
        amountUsdCents: { type: integer }
        method: { type: string }
        status: { type: string }
        poReference: { type: string, nullable: true }
        hostedInvoiceUrl: { type: string, nullable: true }
        invoicePdfUrl: { type: string, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    NabuflowOrgLedgerEntry:
      type: object
      required: [id, entryType, credits, balanceAfter]
      properties:
        id: { type: integer }
        entryType: { type: string }
        credits: { type: integer }
        balanceAfter: { type: integer }
        usdCents: { type: integer, nullable: true }
        userId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    OraTierMeta:
      type: object
      description: >
        Ora-only plan tier metadata. Contains ONLY Ora features (messages,
        images, voice minutes, Deep Thinking, support level) — never AI Builder
        credits, concurrent builds, build queue, or Builder connectors. Single
        source of truth for both website and mobile Ora plan cards.
      required:
        [
          id,
          name,
          priceUsd,
          messageLimit,
          imageLimit,
          windowHours,
          voiceMinutes,
          deepThinking,
          features,
          available,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        priceUsd: { type: number }
        messageLimit: { type: integer }
        imageLimit: { type: integer }
        windowHours: { type: integer }
        voiceMinutes: { type: integer }
        deepThinking: { type: boolean }
        features:
          type: array
          items: { type: string }
        available: { type: boolean }
        current: { type: boolean }

    HelpArticle:
      type: object
      required: [id, slug, category, title, body, tags, isFaq, sortOrder]
      properties:
        id: { type: integer }
        slug: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { type: string }
        isFaq: { type: boolean }
        sortOrder: { type: integer }

    HelpArticlesOutput:
      type: object
      required: [articles, faqs]
      properties:
        articles:
          type: array
          items: { $ref: "#/components/schemas/HelpArticle" }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/HelpArticle" }

    SupportMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }

    SupportChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
        projectId:
          type: integer
          nullable: true
        category: { type: string }
        language: { type: string }
        languageHint: { type: string }

    SupportChatOutput:
      type: object
      required: [reply, canEscalate]
      properties:
        reply: { type: string }
        suggestions:
          type: array
          items: { type: string }
        canEscalate: { type: boolean }

    SupportConversationSummary:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        title:
          type: string
          nullable: true
        createdAt: { type: string }
        updatedAt: { type: string }
        lastMessageAt: { type: string }
        preview:
          type: string
          nullable: true

    SupportConversationsOutput:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/SupportConversationSummary" }

    SupportConversationDetail:
      type: object
      required: [id, messages]
      properties:
        id: { type: integer }
        title:
          type: string
          nullable: true
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
        createdAt: { type: string }
        updatedAt: { type: string }
        lastMessageAt: { type: string }

    SupportAttachmentInput:
      type: object
      required: [fileName, mimeType, dataBase64]
      properties:
        fileName: { type: string }
        mimeType: { type: string }
        dataBase64: { type: string }

    EscalateSupportInput:
      type: object
      required: [subject, transcript]
      properties:
        subject: { type: string, minLength: 1 }
        category: { type: string }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
        projectId:
          type: integer
          nullable: true
        attachments:
          type: array
          items: { $ref: "#/components/schemas/SupportAttachmentInput" }
        deviceInfo:
          type: object
          additionalProperties: true
          nullable: true

    EscalateSupportOutput:
      type: object
      required: [ticketId, emailStatus]
      properties:
        ticketId: { type: integer }
        emailStatus:
          type: string
          enum: [sent, skipped, failed]
        supportEmailUsed:
          type: string
          nullable: true

    SupportTicketAttachment:
      type: object
      required: [fileName, mimeType, size, url]
      properties:
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        url: { type: string }

    SupportTicketSummary:
      type: object
      required: [id, subject, category, status, attachmentCount, emailStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        subject: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [new, open, resolved, closed]
        projectId:
          type: integer
          nullable: true
        attachmentCount: { type: integer }
        emailStatus:
          type: string
          enum: [sent, skipped, failed]
        createdAt: { type: string }
        updatedAt: { type: string }

    SupportTicketsOutput:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketSummary" }

    SupportTicketDetail:
      type: object
      required:
        [id, subject, category, status, emailStatus, createdAt, updatedAt, transcript, attachments]
      properties:
        id: { type: integer }
        subject: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [new, open, resolved, closed]
        projectId:
          type: integer
          nullable: true
        emailStatus:
          type: string
          enum: [sent, skipped, failed]
        createdAt: { type: string }
        updatedAt: { type: string }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketAttachment" }

    BrainstormMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000

    BrainstormChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/BrainstormMessage"
          maxItems: 30
        projectId:
          type: integer
          minimum: 1
          description: "Optional current Builder project. When present, Brainstorm loads that project's files, latest plan, and page map."
        beginnerMode:
          type: boolean
          default: false
          description: "Use the beginner Guided Refinement questioning style."

    BrainstormResolveInput:
      allOf:
        - $ref: "#/components/schemas/BrainstormChatInput"
        - type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [plan, build]
              description: "Billable destination selected by the user after free brainstorming."

    BrainstormChatOutput:
      type: object
      required: [reply, buildIntent]
      properties:
        reply:
          type: string
        buildIntent:
          type: boolean

    BrainstormResolveOutput:
      type: object
      required: [name, prompt, kind, action, brainstormContext]
      properties:
        name:
          type: string
          maxLength: 80
        prompt:
          type: string
          maxLength: 500
        kind:
          type: string
          enum: [web, mobile-cross]
        action:
          type: string
          enum: [plan, build]
        brainstormContext:
          type: array
          maxItems: 30
          items:
