        id: { type: integer }
        path: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        updatedAt: { type: string, format: date-time }

    ProjectFileContent:
      type: object
      required: [id, path, mimeType, content, updatedAt]
      properties:
        id: { type: integer }
        path: { type: string }
        mimeType: { type: string }
        content: { type: string }
        updatedAt: { type: string, format: date-time }

    ProjectFileCreate:
      type: object
      required: [path]
      properties:
        path: { type: string }
        content: { type: string }

    ProjectFileUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }

    ProjectFileRename:
      type: object
      required: [path]
      properties:
        path: { type: string }

    RollbackResult:
      type: object
