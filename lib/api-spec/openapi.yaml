              mutate,
              observe,
              converse,
              plan,
              build,
              image_generate,
              fix_tests,
              fix_types,
              fix_lint,
              debug,
              refactor,
              review,
              explain,
            ]
          description: "The authoritative persisted intent for this exchange. New responses use answer, clarify, plan, mutate, or observe; older values remain listed for compatibility."

    ToolCallEventPayload:
      type: object
      description: >
        JSON payload embedded in a `tool_call` TaskEvent's `message` field.
        Emitted by the agentic builder loop for every tool invocation that does
        not already have a dedicated event type (write_file → file_diff,
        run_command → command_output, etc.).
      required: [tool, args, ok, durationMs, preview]
      properties:
        tool:
          type: string
          description: Name of the tool that was invoked (e.g. read_file, web_search).
        args:
          type: object
          additionalProperties: true
          description: Sanitised + size-capped copy of the tool arguments.
        ok:
          type: boolean
          description: True when the tool call succeeded.
        durationMs:
          type: integer
          description: Wall-clock time the tool call took in milliseconds.
        preview:
          type: string
          description: First ~400 chars of the observation returned to the model.

    TaskEvent:
      type: object
      required: [id, taskId, eventType, message, createdAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        eventType:
          type: string
          description: >
            Lifecycle and step event types emitted by the agent task runner.
            `tool_call` carries a JSON-serialised ToolCallEventPayload in
            `message`; `file_diff` carries file path + diff stats; `command_output`
            carries command argv + stdout/stderr.
          enum:
            [
              queued,
              planning,
              reading_files,
              generating_code,
              editing_files,
              testing,
              fixing_errors,
              updating_preview,
              saving_version,
              completed,
              failed,
              cancelled,
              tool_call,
              file_diff,
              command_output,
            ]
        message: { type: string }
        filePath: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    ExplainChangeInput:
      type: object
      required: [path, before, after]
      properties:
        path:
          type: string
          description: File path being changed (used for context in the prompt)
        before:
          type: string
          description: File content before the change (empty string for new files)
        after:
          type: string
          description: File content after the change (empty string for deleted files)

    ExplainChangeResult:
      type: object
      required: [explanation]
      properties:
        explanation:
          type: string
          description: One-sentence plain-English summary of what changed and why

    AgentTask:
      type: object
      required: [id, projectId, title, kind, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        kind:
          type: string
          enum: [main, background, plan, converse, rollback]
        status:
          type: string
          enum:
            [
              queued,
              answering,
              planning,
              building,
              testing,
              needs_approval,
              needs_review,
              needs_fix,
              completed,
              failed,
              canceled,
              discarded,
            ]
        completionKind:
          type: ["string", "null"]
          enum:
            [
              finalized,
              step_cap,
              wall_clock,
              repeated_error,
              model_stopped,
              aborted,
              checks_failed,
              check_blocked,
              rate_limited,
              container_unavailable,
              null,
            ]
          description: "First-class agent-loop completion outcome. Null for legacy or non-agentic tasks."
        agentIdentity:
          type: string
          enum: [planning, task, main]
          description: "Visible executor for this task. planning = Planner, main = Main Agent, task = legacy staging compatibility."
        origin:
          type: ["string", "null"]
          description: "Surface that created this task. Mirrors chat_messages.origin so delayed reports can be written back to the correct thread."
        stagingSnapshot:
          nullable: true
          description: "Legacy staged files awaiting user approval. Null for Main Agent rows because files are written directly to project_files."
        prompt: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
        queueBatchId: { type: ["string", "null"] }
        queueIndex: { type: ["integer", "null"] }
        report:
          type: ["object", "null"]
          additionalProperties: true
          properties:
            userRequest: { type: string }
            filesCreated: { type: array, items: { type: string } }
            filesChanged: { type: array, items: { type: string } }
            filesRemoved: { type: array, items: { type: string } }
            previewUpdated: { type: boolean }
            warnings: { type: array, items: { type: string } }
            failureEvidence:
              type: object
              description: "Sanitized typed evidence for a terminal platform failure. Values are safe for operator diagnostics and never contain secret material."
              required: [code, message, evidence]
              properties:
                code: { type: string }
                message: { type: string }
                evidence:
                  type: ["object", "null"]
                  additionalProperties: true
            warningChecks:
              type: array
              description: "Non-required checks that failed. Present when validation_status=passed_with_warnings. Preview is available but the build is not fully clean."
              items:
                type: object
                properties:
                  id: { type: string }
                  label: { type: string }
                  message: { type: string }
            architectReview:
              type: ["object", "null"]
              description: "Persisted architect review outcome. When autoFixQueued is true, autoFixTaskId is the machine-readable link to the queued recovery task."
              required:
                [
                  verdict,
                  summary,
                  findings,
                  nextActions,
                  autoFixQueued,
                  creditsCharged,
                  reviewedAt,
                  model,
                ]
              properties:
                verdict: { type: string, enum: [pass, partial, fail] }
                summary: { type: string }
                findings:
                  type: array
                  items:
                    type: object
                    required: [severity, title, detail]
                    properties:
                      severity: { type: string, enum: [critical, high, medium, low] }
                      title: { type: string }
                      detail: { type: string }
                      file: { type: ["string", "null"] }
                nextActions: { type: array, items: { type: string } }
                autoFixQueued: { type: boolean }
                autoFixTaskId:
                  type: ["integer", "null"]
                  description: "Queued architect auto-fix task id, or null when no auto-fix was queued."
                creditsCharged: { type: integer }
                reviewedAt: { type: string }
                model: { type: string }
                skipped: { type: boolean }
                skipReason: { type: string }
                isReReview: { type: boolean }
                completedWithWarnings: { type: boolean }
            suggestions: { type: array, items: { type: string } }
            nextRecommendation: { type: string }
            nativeFeatures:
              type: array
              items: { type: string }
              description: Native Expo/device features used (e.g. Camera, Location, Push Notifications). Only present on mobile builds. Features require a real device — they cannot be previewed in the web iframe.
            knowledgeApplied:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  category: { type: string }
            securityFindings:
              type: ["object", "null"]
              description: Populated when a SAST or npm-audit gate blocked the Apply step. UI renders findings as an expandable "Security findings" section on the failed task row.
              properties:
                kind: { type: string, enum: [sast, npm_audit] }
                blocked: { type: boolean }
                message: { type: string }
                fixPrompt: { type: string }
                sast:
                  type: array
                  items:
                    type: object
                    properties:
                      file: { type: string }
                      line: { type: ["integer", "null"] }
                      message: { type: string }
                      detail: { type: ["string", "null"] }
                      severity: { type: string, enum: [error, warning, info] }
                      remediation: { type: ["string", "null"] }
                npmAudit:
                  type: object
                  properties:
                    critical: { type: integer }
                    high: { type: integer }
                    parsed: { type: boolean }
                    packages:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          severity: { type: string }
                    remediation: { type: ["string", "null"] }
            versionId: { type: ["integer", "null"] }
        userFeedback:
          type: ["string", "null"]
          enum: [positive, negative, null]
        suggestions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        elapsedSeconds: { type: ["integer", "null"] }
        runMode:
          type: ["string", "null"]
          enum: [foreground, background, null]
          description: "Foreground tasks block the chat. Background tasks run async (Task #509) with extended wall-clock and credit reservation."
        wallClockCapMs:
          type: ["integer", "null"]
          description: "Optional per-task wall-clock cap (ms) passed into the agent loop. Set for background tasks."
        creditsReserved:
          type: ["integer", "null"]
          description: "Credits deducted upfront for background tasks. Refunded on cancel/discard; cleared on apply/complete."
        pausedAt:
          type: ["string", "null"]
          format: date-time
        appliedAt:
          type: ["string", "null"]
          format: date-time
          description: "Set when a staged-review snapshot is applied."
        discardedAt:
          type: ["string", "null"]
          format: date-time
        hasBrainstormContext:
          type: boolean
          description: "True when the task was created with brainstorm conversation context forwarded to the builder."
        brainstormTurnCount:
          type: ["integer", "null"]
          description: "Number of brainstorm conversation turns (user + assistant messages) included as context."

    BackgroundJob:
      type: object
      required: [id, projectId, projectName, status, createdAt, runMode]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        projectName: { type: string }
        title: { type: string }
        status:
          type: string
          enum:
            [
              queued,
              answering,
              planning,
              building,
              testing,
              needs_approval,
              needs_review,
              needs_fix,
              completed,
              failed,
              canceled,
              discarded,
            ]
        runMode:
          type: string
          enum: [foreground, background]
        creditsReserved: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }

    ListBackgroundJobsResponse:
      type: object
