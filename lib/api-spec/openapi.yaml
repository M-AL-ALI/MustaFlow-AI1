openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MustaFlow AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: User projects (apps being built)
  - name: chat
    description: AI builder chat messages
  - name: tasks
    description: Background and main agent tasks
  - name: versions
    description: Project versions and rollback points
  - name: knowledge
    description: Knowledge Vault entries
  - name: secrets
    description: Project secrets (masked)
  - name: openai
    description: OpenAI AI chat operations
  - name: workspaces
    description: User workspaces (containers for projects)
  - name: credits
    description: User credits and billing
  - name: builds
    description: EAS mobile cloud builds (iOS / Android)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List user workspaces (auto-creates default if empty)
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /projects/summary:
    get:
      operationId: getProjectsSummary
      tags: [projects]
      summary: Dashboard aggregate counts
      responses:
        "200":
          description: Counts of projects by status and type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummary"

  /projects/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Messages in builder chat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to the AI builder. Returns the saved user + assistant messages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: User and assistant messages persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatExchange"

  /projects/{id}/tasks/{taskId}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: Live event stream for a task (poll every 1-2 s)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Events emitted so far for this task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of tasks for a project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Queue a new background agent task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"

  /projects/{id}/tasks/{taskId}/feedback:
    patch:
      operationId: submitTaskFeedback
      tags: [tasks]
      summary: Submit thumbs up or down feedback on a task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/versions:
    get:
      operationId: listVersions
      tags: [versions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectVersion"
    post:
      operationId: createVersion
      tags: [versions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectVersionInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVersion"

  /projects/{id}/versions/{versionId}:
    get:
      operationId: getVersion
      tags: [versions]
      summary: Get a single version including full files snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Version detail with files snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVersionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/versions/{versionId}/rollback:
    post:
      operationId: rollbackVersion
      tags: [versions]
      summary: Restore the project files to a saved version snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Rollback applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResult"

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List generated files for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFileSummary"
    post:
      operationId: createProjectFile
      tags: [projects]
      summary: Create a new file in the project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileCreate"
      responses:
        "201":
          description: Created file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "409":
          description: File path already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/files/{fileId}:
    get:
      operationId: getProjectFile
      tags: [projects]
      summary: Get the contents of one generated file by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProjectFile
      tags: [projects]
      summary: Update the contents of a generated file
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileUpdate"
      responses:
        "200":
          description: Updated file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Masked secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecretEntry"
    post:
      operationId: createSecret
      tags: [secrets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretEntry"

  /projects/{id}/duplicate:
    post:
      operationId: duplicateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Duplicated project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateProjectResult"

  /projects/{id}/page-map:
    get:
      operationId: getPageMap
      tags: [projects]
      summary: Get the page/screen flow map for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Page map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"
    put:
      operationId: putPageMap
      tags: [projects]
      summary: Save the page/screen flow map for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageMapData"
      responses:
        "200":
          description: Updated page map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"

  /projects/{id}/page-map/analyze:
    post:
      operationId: analyzePageMap
      tags: [projects]
      summary: Re-run AI extraction on project files and update the page map
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - in: query
          name: platform
          schema: { type: string, enum: [web, ios, android], default: web }
      responses:
        "200":
          description: Updated page map after AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"

  /projects/{id}/publish:
    post:
      operationId: publishProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Publish result with public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"

  /projects/{id}/unpublish:
    post:
      operationId: unpublishProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project unpublished
          content:
            application/json:
              schema:
                type: object
                required: [projectId, status]
                properties:
                  projectId: { type: integer }
                  status: { type: string }

  /projects/{id}/publish-readiness:
    get:
      operationId: getPublishReadiness
      tags: [projects]
      summary: Automated pre-publish readiness checks
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - in: query
          name: env
          schema: { type: string, enum: [testing, production], default: testing }
      responses:
        "200":
          description: Readiness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResult"

  /projects/{id}/mobile-settings:
    get:
      operationId: getMobileAppSettings
      tags: [projects]
      summary: Read current mobile app.json settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current settings (empty strings when app.json not yet generated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAppSettings"
        "400":
          description: Not a mobile project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: saveMobileAppSettings
      tags: [projects]
      summary: Update mobile app.json settings (app name, bundle ID, package name, version, splash color)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileAppSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAppSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project or app.json not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/secrets/{secretId}:
    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a project secret
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: secretId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean }
                  id: { type: integer }

  /projects/{id}/secrets/{secretId}/verify:
    post:
      operationId: verifySecret
      tags: [secrets]
      summary: Attempt automated verification of a secret value
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: secretId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretVerifyResult"

  /projects/{id}/deployments:
    get:
      operationId: listDeployments
      tags: [projects]
      summary: Deployment history for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deployment history
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeploymentLog"

  /credits:
    get:
      operationId: getUserCredits
      tags: [credits]
      summary: Get current user credit balance
      responses:
        "200":
          description: User credit info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCredit"

  /billing/packages:
    get:
      operationId: listBillingPackages
      tags: [credits]
      summary: List available credit purchase packages
      responses:
        "200":
          description: Available credit packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPackagesResult"

  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [credits]
      summary: Create a Stripe checkout session for a credit package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Checkout session or setup-required response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResult"

  /credits/transactions:
    get:
      operationId: listCreditTransactions
      tags: [credits]
      summary: List credit transactions for current user
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditTransaction"

  /knowledge:
    get:
      operationId: listKnowledge
      tags: [knowledge]
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: integer }
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [info, warning, error] }
        - name: approvedOnly
          in: query
          required: false
          schema: { type: boolean }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: archived
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Knowledge Vault entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeEntry"
    post:
      operationId: createKnowledge
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"

  /knowledge/{id}:
    patch:
      operationId: updateKnowledge
      tags: [knowledge]
      summary: Update annotation, approvedForReuse, or archivedAt on a knowledge entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteKnowledge
      tags: [knowledge]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /projects/{id}/builds:
    post:
      operationId: triggerMobileBuild
      tags: [builds]
      summary: Trigger an EAS cloud build for iOS or Android
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileBuildInput"
      responses:
        "202":
          description: Build queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileBuildQueued"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: EAS credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listMobileBuilds
      tags: [builds]
      summary: List EAS builds for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Build list
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items:
                      $ref: "#/components/schemas/MobileBuildLog"

  /projects/{id}/builds/{buildLogId}:
    get:
      operationId: getMobileBuild
      tags: [builds]
      summary: Get a single EAS build record and status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: buildLogId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Build record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileBuildLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/builds/{buildLogId}/logs:
    get:
      operationId: getMobileBuildLogs
      tags: [builds]
      summary: Fetch EAS build log output for a build
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: buildLogId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Build logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileBuildLogsResult"

  /activity:
    get:
      operationId: getRecentActivity
      tags: [projects]
      summary: Recent activity feed across all projects
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Workspace:
      type: object
      required: [id, ownerUserId, name, type, createdAt, updatedAt]
      properties:
        id: { type: integer }
        ownerUserId: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        type:
          type: string
          enum: [personal, business, client, team]
        deletedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type:
          type: string
          enum: [personal, business, client, team]
          default: personal

    WorkspaceUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [personal, business, client, team]

    Project:
      type: object
      required: [id, name, kind, status, agentMode, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workspaceId: { type: ["integer", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        kind:
          type: string
          enum: [web, mobile-ios, mobile-android, mobile-cross, fullstack, dashboard, api, design, automation, marketplace, chatbot, spreadsheet]
        platform:
          type: string
          enum: [web, ios, android, cross]
        status:
          type: string
          enum: [draft, building, testing, published, failed]
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        lastTaskSummary: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        publicSlug: { type: ["string", "null"] }
        siteTitle: { type: ["string", "null"] }
        metaDescription: { type: ["string", "null"] }
        themeColor: { type: ["string", "null"] }
        mobilePreviewUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        workspaceId: { type: integer }
        kind:
          type: string
          enum: [web, mobile-ios, mobile-android, mobile-cross, fullstack, dashboard, api, design, automation, marketplace, chatbot, spreadsheet]
        initialPrompt: { type: string }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft, building, testing, published, failed]
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        siteTitle: { type: string }
        metaDescription: { type: string }
        themeColor: { type: string }

    MobileAppSettingsInput:
      type: object
      properties:
        appName: { type: string, minLength: 1 }
        bundleId: { type: string }
        packageName: { type: string }
        version: { type: string }
        splashBackgroundColor: { type: string }
        iconBase64: { type: string, description: "Base64-encoded PNG for the app icon (1024×1024 recommended). Stored as assets/icon.png." }

    MobileAppSettings:
      type: object
      required: [appName, bundleId, packageName, version, splashBackgroundColor]
      properties:
        appName: { type: string }
        bundleId: { type: string }
        packageName: { type: string }
        version: { type: string }
        splashBackgroundColor: { type: string }
        iconUrl: { type: ["string", "null"], description: "Preview URL for the current icon, or null if not yet uploaded." }
        taskId: { type: ["integer", "null"], description: "ID of the AgentTask created for this save (for event polling)." }

    ProjectsSummary:
      type: object
      required: [total, byStatus, byKind, recent]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
        recent:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    ChatMessage:
      type: object
      required: [id, projectId, role, content, agentMode, planMode, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        role:
          type: string
          enum: [user, assistant, system]
        content: { type: string }
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        planMode: { type: boolean }
        plan:
          type: ["object", "null"]
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    ChatMessageInput:
      type: object
      required: [content, agentMode, planMode]
      properties:
        content: { type: string, minLength: 1 }
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        planMode: { type: boolean }
        background: { type: boolean }

    ChatExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: "#/components/schemas/ChatMessage" }
        assistantMessage: { $ref: "#/components/schemas/ChatMessage" }

    TaskEvent:
      type: object
      required: [id, taskId, eventType, message, createdAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        eventType:
          type: string
          enum:
            [
              queued,
              planning,
              reading_files,
              generating_code,
              editing_files,
              testing,
              fixing_errors,
              updating_preview,
              saving_version,
              completed,
              failed,
            ]
        message: { type: string }
        filePath: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AgentTask:
      type: object
      required: [id, projectId, title, kind, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        kind:
          type: string
          enum: [main, background]
        status:
          type: string
          enum: [queued, planning, building, testing, needs_approval, completed, failed, canceled]
        prompt: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
        report:
          type: ["object", "null"]
          additionalProperties: true
          properties:
            userRequest: { type: string }
            filesCreated: { type: array, items: { type: string } }
            filesChanged: { type: array, items: { type: string } }
            filesRemoved: { type: array, items: { type: string } }
            previewUpdated: { type: boolean }
            warnings: { type: array, items: { type: string } }
            suggestions: { type: array, items: { type: string } }
            nextRecommendation: { type: string }
            nativeFeatures:
              type: array
              items: { type: string }
              description: Native Expo/device features used (e.g. Camera, Location, Push Notifications). Only present on mobile builds. Features require a real device — they cannot be previewed in the web iframe.
            knowledgeApplied:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  category: { type: string }
        userFeedback:
          type: ["string", "null"]
          enum: [positive, negative, null]
        suggestions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }

    AgentTaskInput:
      type: object
      required: [title, kind]
      properties:
        title: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [main, background]
        prompt: { type: string }

    ProjectVersion:
      type: object
      required: [id, projectId, label, createdAt, filesCount]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        label: { type: string }
        note: { type: ["string", "null"] }
        filesCount: { type: integer }
        createdAt: { type: string, format: date-time }
        planSnapshot:
          nullable: true
          type: object
          additionalProperties: true

    ProjectVersionInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1 }
        note: { type: string }

    ProjectVersionDetail:
      type: object
      required: [id, projectId, label, createdAt, filesSnapshot]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        label: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        filesSnapshot:
          type: array
          items:
            type: object
            required: [path, content, mimeType]
            properties:
              path: { type: string }
              content: { type: string }
              mimeType: { type: string }

    SecretEntry:
      type: object
      required: [id, projectId, name, masked, environment, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        masked: { type: string }
        environment:
          type: string
          enum: [development, testing, staging, production]
        verificationStatus: { type: string }
        category: { type: ["string", "null"] }
        envWarning: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    SecretInput:
      type: object
      required: [name, value, environment]
      properties:
        name: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        environment:
          type: string
          enum: [development, testing, staging, production]

    TaskFeedbackInput:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: string
          enum: [positive, negative]

    KnowledgeEntry:
      type: object
      required: [id, title, category, content, type, severity, approvedForReuse, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        content: { type: string }
        type: { type: string }
        severity: { type: string }
        projectId: { type: ["integer", "null"] }
        userId: { type: ["string", "null"] }
        relatedTaskId: { type: ["integer", "null"] }
        relatedVersionId: { type: ["integer", "null"] }
        tags: { type: ["string", "null"] }
        approvedForReuse: { type: boolean }
        diffSummary:
          type: ["object", "null"]
          additionalProperties: true
        annotation: { type: ["string", "null"] }
        archivedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    KnowledgeInput:
      type: object
      required: [title, category, content]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string }
        type: { type: string }
        severity: { type: string }
        content: { type: string, minLength: 1 }

    KnowledgeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string }
        type: { type: string }
        severity: { type: string }
        content: { type: string, minLength: 1 }
        annotation: { type: ["string", "null"] }
        approvedForReuse: { type: boolean }
        archived: { type: boolean }

    ProjectFileSummary:
      type: object
      required: [id, path, mimeType, size, updatedAt]
      properties:
        id: { type: integer }
        path: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        updatedAt: { type: string, format: date-time }

    ProjectFileContent:
      type: object
      required: [id, path, mimeType, content, updatedAt]
      properties:
        id: { type: integer }
        path: { type: string }
        mimeType: { type: string }
        content: { type: string }
        updatedAt: { type: string, format: date-time }

    ProjectFileCreate:
      type: object
      required: [path]
      properties:
        path: { type: string }
        content: { type: string }

    ProjectFileUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }

    RollbackResult:
      type: object
      required: [restoredFiles, versionId, label]
      properties:
        restoredFiles: { type: integer }
        versionId: { type: integer }
        label: { type: string }

    DuplicateProjectResult:
      type: object
      required: [id, name, kind, status, ownerId, filesCount, secretsCopied, note]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        status: { type: string }
        ownerId: { type: string }
        filesCount: { type: integer }
        secretsCopied: { type: boolean }
        note: { type: string }

    PublishResult:
      type: object
