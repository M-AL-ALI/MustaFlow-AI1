          enum: [open, complete, expired, unknown]
        paymentStatus:
          type: string
          description: Stripe session.payment_status (paid | unpaid | no_payment_required | payment_failed).
          enum: [paid, unpaid, no_payment_required, payment_failed]
        creditsGranted:
          type: boolean
          description: Whether the credits for this session have already been recorded in credit_transactions (i.e. the webhook fired).
