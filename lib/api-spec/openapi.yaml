          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRole"
    post:
      operationId: grantAdminRole
      tags: [admin]
      summary: Grant or update a role for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleInput"
      responses:
        "200":
          description: Role granted
          content:
            application/json:
              schema:
                type: object
                required: [ok, role]
                properties:
                  ok: { type: boolean }
                  role: { $ref: "#/components/schemas/AdminRole" }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/roles/{userId}:
    delete:
      operationId: revokeAdminRole
      tags: [admin]
      summary: Revoke a role grant — user reverts to default "user" role
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Role revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, userId]
                properties:
                  ok: { type: boolean }
                  userId: { type: string }
                  note: { type: string }

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: List secret audit log entries with pagination
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogPage"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Workspace:
      type: object
      required: [id, ownerUserId, name, type, createdAt, updatedAt]
      properties:
        id: { type: integer }
        ownerUserId: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        type:
          type: string
          enum: [personal, business, client, team]
        deletedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        type:
          type: string
          enum: [personal, business, client, team]
          default: personal

    WorkspaceUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [personal, business, client, team]

    Project:
      type: object
      required: [id, name, kind, status, agentMode, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workspaceId: { type: ["integer", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        kind:
          type: string
          enum:
            [
              web,
              mobile-ios,
              mobile-android,
              mobile-cross,
              fullstack,
              dashboard,
              api,
              design,
              automation,
              marketplace,
              chatbot,
              spreadsheet,
            ]
        platform:
          type: string
          enum: [web, ios, android, cross]
        status:
          type: string
          enum: [draft, building, testing, published, failed]
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        lastTaskSummary: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        publicSlug: { type: ["string", "null"] }
        siteTitle: { type: ["string", "null"] }
        metaDescription: { type: ["string", "null"] }
        themeColor: { type: ["string", "null"] }
        mobilePreviewUrl: { type: ["string", "null"] }
        containerId:
          {
            type: ["string", "null"],
            description: "Fly.io Machine ID for this project's dev container. Null = not provisioned.",
          }
        containerStatus:
          type: string
          enum: [stopped, starting, running, hibernated, error]
          description: "Current dev container lifecycle state."
        containerUrl:
          {
            type: ["string", "null"],
            description: "Proxy URL to reach the container's dev server.",
          }
        prodContainerId:
          {
            type: ["string", "null"],
            description: "Fly.io Machine ID for the live production container. Null = not deployed.",
          }
        prodContainerStatus:
          type: string
          enum: [stopped, starting, running, hibernated, error, deploying]
          description: "Current production container lifecycle state."
        prodContainerUrl:
          {
            type: ["string", "null"],
            description: "Proxy URL to reach the production container. Null = not deployed.",
          }
        healthScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
          description: "0–100 score derived from generated file quality: accessibility (alt/ARIA/semantic), SEO (title/description/h1), performance (script count/lazy), security (no eval/document.write). Null if no files built yet."
        defaultAgent:
          type: string
          enum: [planning, task, main]
          description: "User's preferred agent for this project. planning = Planning Agent, task = Task Agent (staging gate), main = Main Agent (direct fast edit)."
        projectFormat:
          type: string
          enum: [static-html, react-vite]
          description: "Builder output format. static-html = CDN-based single HTML blob (legacy). react-vite = multi-file React + Vite npm project (default for new web projects)."
        runtime:
          type: string
          enum: [react-vite, node20, node22, python312]
          description: "Server-side runtime for this project. react-vite = React + Vite static frontend (default). node20 / node22 = Node.js backend (Express/Fastify, runs in container). python312 = Python 3.12 backend (Flask/FastAPI, runs in container)."
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        workspaceId: { type: integer }
        kind:
          type: string
          enum:
            [
              web,
              mobile-ios,
              mobile-android,
              mobile-cross,
              fullstack,
              dashboard,
              api,
              design,
              automation,
              marketplace,
              chatbot,
              spreadsheet,
            ]
        runtime:
          type: string
          enum: [react-vite, node20, node22, python312]
          description: "Server-side runtime. Defaults to react-vite for web projects."
        initialPrompt: { type: string }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [draft, building, testing, published, failed]
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        defaultAgent:
          type: string
          enum: [planning, task, main]
          description: "User's preferred agent for this project."
        siteTitle: { type: string }
        metaDescription: { type: string }
        themeColor: { type: string }

    MobileAppSettingsInput:
      type: object
      properties:
        appName: { type: string, minLength: 1 }
        bundleId: { type: string }
        packageName: { type: string }
        version: { type: string }
        splashBackgroundColor: { type: string }
        iconBase64:
          {
            type: string,
            description: "Base64-encoded PNG for the app icon (1024×1024 recommended). Stored as assets/icon.png.",
          }

    MobileAppSettings:
      type: object
      required: [appName, bundleId, packageName, version, splashBackgroundColor]
      properties:
        appName: { type: string }
        bundleId: { type: string }
        packageName: { type: string }
        version: { type: string }
        splashBackgroundColor: { type: string }
        iconUrl:
          {
            type: ["string", "null"],
            description: "Preview URL for the current icon, or null if not yet uploaded.",
          }
        taskId:
          {
            type: ["integer", "null"],
            description: "ID of the AgentTask created for this save (for event polling).",
          }

    ProjectsSummary:
      type: object
      required: [total, byStatus, byKind, recent]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
        recent:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    ChatMessage:
      type: object
      required: [id, projectId, role, content, agentMode, planMode, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        role:
          type: string
          enum: [user, assistant, system]
        content: { type: string }
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        planMode: { type: boolean }
        plan:
          type: ["object", "null"]
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    ChatMessageInput:
      type: object
      required: [content, agentMode, planMode]
      properties:
        content: { type: string, minLength: 1 }
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        planMode: { type: boolean }
        background: { type: boolean }
        agentIdentity:
          type: string
          enum: [planning, task, main]
          description: "Optional explicit agent override. If not provided, the server calls resolveAgentIdentity to pick one automatically."

    ChatExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: "#/components/schemas/ChatMessage" }
        assistantMessage: { $ref: "#/components/schemas/ChatMessage" }

    TaskEvent:
      type: object
      required: [id, taskId, eventType, message, createdAt]
      properties:
        id: { type: integer }
        taskId: { type: integer }
        eventType:
          type: string
          enum:
            [
              queued,
              planning,
              reading_files,
              generating_code,
              editing_files,
              testing,
              fixing_errors,
              updating_preview,
              saving_version,
              completed,
              failed,
            ]
        message: { type: string }
        filePath: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AgentTask:
      type: object
      required: [id, projectId, title, kind, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        kind:
          type: string
          enum: [main, background]
        status:
          type: string
          enum:
            [
              queued,
              planning,
              building,
              testing,
              needs_approval,
              needs_review,
              completed,
              failed,
              canceled,
              discarded,
            ]
        agentIdentity:
          type: string
          enum: [planning, task, main]
          description: "Which of the three agents handled this task. planning = Planning Agent, task = Task Agent (staging gate), main = Main Agent (direct fast edit)."
        stagingSnapshot:
          type: ["object", "null"]
          additionalProperties: true
          description: "Task Agent stores generated files here before user approval. Null for Main Agent (files written directly). Promoted to project_files on Apply; cleared on Discard."
        prompt: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
        queueBatchId: { type: ["string", "null"] }
        queueIndex: { type: ["integer", "null"] }
        report:
          type: ["object", "null"]
          additionalProperties: true
          properties:
            userRequest: { type: string }
            filesCreated: { type: array, items: { type: string } }
            filesChanged: { type: array, items: { type: string } }
            filesRemoved: { type: array, items: { type: string } }
            previewUpdated: { type: boolean }
            warnings: { type: array, items: { type: string } }
            suggestions: { type: array, items: { type: string } }
            nextRecommendation: { type: string }
            nativeFeatures:
              type: array
              items: { type: string }
              description: Native Expo/device features used (e.g. Camera, Location, Push Notifications). Only present on mobile builds. Features require a real device — they cannot be previewed in the web iframe.
            knowledgeApplied:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  category: { type: string }
            versionId: { type: ["integer", "null"] }
        userFeedback:
          type: ["string", "null"]
          enum: [positive, negative, null]
        suggestions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        elapsedSeconds: { type: ["integer", "null"] }

    AgentTaskInput:
      type: object
      required: [title, kind]
      properties:
        title: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [main, background]
        prompt: { type: string }

    ProjectVersion:
      type: object
      required: [id, projectId, label, createdAt, filesCount]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        label: { type: string }
        note: { type: ["string", "null"] }
        changelogEntry: { type: ["string", "null"] }
        filesCount: { type: integer }
        createdAt: { type: string, format: date-time }
        planSnapshot:
          nullable: true
          type: object
          additionalProperties: true

    ProjectVersionInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1 }
        note: { type: string }

    PatchVersionBody:
      type: object
      properties:
        label: { type: string, minLength: 1 }

    ProjectVersionDetail:
      type: object
      required: [id, projectId, label, createdAt, filesSnapshot]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        label: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        filesSnapshot:
          type: array
          items:
            type: object
            required: [path, content, mimeType]
            properties:
              path: { type: string }
              content: { type: string }
              mimeType: { type: string }

    SecretEntry:
      type: object
      required: [id, projectId, name, masked, environment, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        masked: { type: string }
        environment:
          type: string
          enum: [development, testing, staging, production]
        verificationStatus: { type: string }
        category: { type: ["string", "null"] }
        envWarning: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    SecretAuditEntry:
      type: object
      required: [id, projectId, secretName, action, actorId, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        secretId: { type: ["integer", "null"] }
        secretName: { type: string }
        action:
          type: string
          enum: [created, updated, deleted, accessed, verified, verification_failed]
        actorId: { type: string }
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    SecretInput:
      type: object
      required: [name, value, environment]
      properties:
        name: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
        environment:
          type: string
          enum: [development, testing, staging, production]

    TaskFeedbackInput:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: string
          enum: [positive, negative]

    KnowledgeEntry:
      type: object
      required: [id, title, category, content, type, severity, approvedForReuse, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        content: { type: string }
        type: { type: string }
        severity: { type: string }
        projectId: { type: ["integer", "null"] }
        userId: { type: ["string", "null"] }
        relatedTaskId: { type: ["integer", "null"] }
        relatedVersionId: { type: ["integer", "null"] }
        tags: { type: ["string", "null"] }
        approvedForReuse: { type: boolean }
        diffSummary:
          type: ["object", "null"]
          additionalProperties: true
        annotation: { type: ["string", "null"] }
        archivedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    KnowledgeInput:
      type: object
      required: [title, category, content]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string }
        type: { type: string }
        severity: { type: string }
        content: { type: string, minLength: 1 }

    KnowledgeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string }
        type: { type: string }
        severity: { type: string }
        content: { type: string, minLength: 1 }
        annotation: { type: ["string", "null"] }
        approvedForReuse: { type: boolean }
        archived: { type: boolean }

    ProjectFileSummary:
      type: object
      required: [id, path, mimeType, size, updatedAt]
