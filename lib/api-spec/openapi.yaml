        "400":
          description: Error during approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/skills/drafts/{name}/reject:
    post:
      operationId: rejectAdminSkillDraft
      tags: [admin]
      summary: Reject and permanently delete a draft skill
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft rejected
          content:
            application/json:
              schema:
                type: object
                required: [name, rejected]
                properties:
                  name: { type: string }
                  rejected: { type: boolean }
        "400":
          description: Error during rejection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/eval-results:
    get:
      operationId: getAdminEvalResults
      tags: [admin]
