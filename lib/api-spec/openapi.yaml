    PageMapEdge:
      type: object
      required: [id, source, target, connectionType, aiGenerated]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        connectionType:
          type: string
          enum: [nav, auth-gate, redirect, external]
        aiGenerated: { type: boolean }

    PageMapPlatformData:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PageMapNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/PageMapEdge" }

    PageMapData:
      type: object
      required: [web, ios, android]
      properties:
        web: { $ref: "#/components/schemas/PageMapPlatformData" }
        ios: { $ref: "#/components/schemas/PageMapPlatformData" }
        android: { $ref: "#/components/schemas/PageMapPlatformData" }

    PageMapResponse:
      type: object
      required: [pageMapData]
      properties:
        pageMapData: { $ref: "#/components/schemas/PageMapData" }

    CreditTransaction:
      type: object
      required: [id, userId, type, amount, balanceAfter, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        projectId: { type: ["integer", "null"] }
        type: { type: string }
        amount: { type: integer }
        description: { type: ["string", "null"] }
        balanceAfter: { type: integer }
        createdAt: { type: string, format: date-time }

    BillingPackage:
      type: object
      required: [id, label, credits, priceUsd, description, available]
      properties:
        id: { type: string }
        label: { type: string }
        credits: { type: integer }
        priceUsd: { type: number }
        description: { type: string }
        available: { type: boolean }

    BillingPackagesResult:
      type: object
      required: [stripeConfigured, packages]
      properties:
        stripeConfigured: { type: boolean }
        packages:
          type: array
          items:
            $ref: "#/components/schemas/BillingPackage"

    BillingCheckoutInput:
      type: object
      required: [packageId, successUrl, cancelUrl]
      properties:
        packageId: { type: string }
        successUrl: { type: string }
        cancelUrl: { type: string }

    BillingCheckoutResult:
      type: object
      properties:
        checkoutUrl: { type: string }
        sessionId: { type: string }
        setupRequired: { type: boolean }
        message: { type: string }
        error: { type: string }
