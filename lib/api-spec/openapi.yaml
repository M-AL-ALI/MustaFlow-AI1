        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project or package.json not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/database/provision:
    post:
      operationId: provisionDatabase
      tags: [database]
      summary: Provision a database for the project and inject DATABASE_URL secret
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseProvisionInput"
      responses:
        "200":
          description: Database provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
        "400":
          description: Invalid provider or already provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/database:
    get:
      operationId: getDatabaseStatus
      tags: [database]
      summary: Get the current database status for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Database status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
    delete:
      operationId: deprovisionDatabase
      tags: [database]
      summary: Remove the project database and DATABASE_URL secret
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Database removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /projects/{id}/database/query:
    post:
      operationId: queryDatabase
      tags: [database]
      summary: Run a read-only SQL query against the project database (SELECT only, 200-row limit)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseQueryInput"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseQueryResult"
        "400":
          description: Query rejected (not SELECT or no database provisioned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/database/schema:
    get:
      operationId: getDatabaseSchema
      tags: [database]
      summary: Get the schema (tables and columns) of the project database
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Database schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSchemaResult"
        "400":
          description: No database provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/database/snapshots:
    post:
      operationId: createDbSnapshot
      tags: [database]
      summary: Capture a database snapshot (pg_dump equivalent via SQL)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDbSnapshotInput"
      responses:
        "201":
          description: Snapshot captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbSnapshotListItem"
        "400":
          description: No database provisioned or unsupported provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listDbSnapshots
      tags: [database]
      summary: List all database snapshots for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DbSnapshotListItem"

  /projects/{id}/database/snapshots/{snapshotId}/restore:
    post:
      operationId: restoreDbSnapshot
      tags: [database]
      summary: Restore a database snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: snapshotId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbSnapshotRestoreResult"
        "400":
          description: No database provisioned or unsupported provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/database/snapshots/{snapshotId}:
    delete:
      operationId: deleteDbSnapshot
      tags: [database]
      summary: Delete a database snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: snapshotId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Snapshot deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint (public — called by Stripe)
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  processed: { type: boolean }

  /billing/credits:
    get:
      operationId: getBillingCredits
      tags: [billing]
      summary: Current credit balance (billing alias for /credits)
      responses:
        "200":
          description: User credit info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCredit"

  /billing/transactions:
    get:
      operationId: listBillingTransactions
      tags: [billing]
      summary: Transaction history (billing alias for /credits/transactions)
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditTransaction"

  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Current subscription tier and status for the authenticated user
      responses:
        "200":
          description: Subscription info
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    tier,
                    status,
                    cancelAtPeriodEnd,
                    monthlyCredits,
                    maxConcurrentBuilds,
                    stripeConfigured,
                    publishableKey,
                    tiers,
                  ]
                properties:
                  tier: { type: string }
                  status: { type: string }
                  currentPeriodEnd: { type: string, format: date-time, nullable: true }
                  gracePeriodEnd: { type: string, format: date-time, nullable: true }
                  cancelAtPeriodEnd: { type: boolean }
                  monthlyCredits: { type: integer }
                  maxConcurrentBuilds: { type: integer }
                  stripeConfigured: { type: boolean }
                  publishableKey: { type: string }
                  tiers:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          name,
                          priceUsd,
                          monthlyCredits,
                          maxConcurrentBuilds,
                          features,
                          available,
                          current,
                        ]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        priceUsd: { type: number }
                        monthlyCredits: { type: integer }
                        maxConcurrentBuilds: { type: integer }
                        features:
                          type: array
                          items: { type: string }
                        available: { type: boolean }
                        current: { type: boolean }
                  oraTiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/OraTierMeta"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/ora-plans:
    get:
      operationId: getBillingOraPlans
      tags: [billing]
      summary: Public Ora-only plan metadata (single source of truth for Ora plan cards)
      responses:
        "200":
          description: Ora-only plan tiers
          content:
            application/json:
              schema:
                type: object
                required: [tiers]
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/OraTierMeta"

  /billing/nabuflow/plans:
    get:
      operationId: listNabuflowPlans
      tags: [billing]
      summary: NabuFlow Builder plan family (Orbit/Comet/Nova + Constellation stub)
      responses:
        "200":
          description: NabuFlow plans
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/NabuflowPlan"

  /billing/nabuflow/state:
    get:
      operationId: getNabuflowBillingState
      tags: [billing]
      summary: NabuFlow billing state — plan, card, cap, counters and reset date (read-only mirror of the server-side build gate)
      responses:
        "200":
          description: Billing state
          content:
            application/json:
              schema:
                type: object
                required: [enforcementEnabled, exempt, canBuild]
                properties:
                  enforcementEnabled: { type: boolean }
                  exempt: { type: boolean }
                  canBuild: { type: boolean }
                  blockedReason:
                    nullable: true
                    description: Structured gate error (code, message, remaining counters, reset date, upgrade target) when canBuild is false.
                  plan:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/NabuflowPlan" }]
                  subscription:
                    type: object
                    nullable: true
                    required: [status, cancelAtPeriodEnd]
                    properties:
                      status: { type: string }
                      cancelAtPeriodEnd: { type: boolean }
                      pendingPlanId:
                        type: string
                        nullable: true
                        description: Lower-tier plan scheduled for the next renewal, or null.
                      pendingEffectiveAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: Stripe period boundary when pendingPlanId takes effect.
                      currentCycleStart: { type: string, format: date-time, nullable: true }
                      currentCycleEnd: { type: string, format: date-time, nullable: true }
                      dunningStatus: { type: string, nullable: true }
                      dunningGraceUntil: { type: string, format: date-time, nullable: true }
                  card:
                    type: object
                    nullable: true
                    properties:
                      brand: { type: string, nullable: true }
                      last4: { type: string, nullable: true }
                      expMonth: { type: integer, nullable: true }
                      expYear: { type: integer, nullable: true }
                  spendCap:
                    type: object
                    nullable: true
                    required: [usdCents, defaultUsdCents, maxUsdCents]
                    properties:
                      usdCents: { type: integer }
                      defaultUsdCents: { type: integer }
                      maxUsdCents: { type: integer }
                  cycle:
                    type: object
                    nullable: true
                    required:
                      [
                        id,
                        includedCredits,
                        rolloverCredits,
                        usedIncludedCredits,
                        remainingIncludedCredits,
                        overageCredits,
                        overageUsdCents,
                        proBuildsUsed,
                        deepBuildsUsed,
                      ]
                    properties:
                      id: { type: integer }
                      includedCredits: { type: integer }
                      rolloverCredits: { type: integer }
                      usedIncludedCredits: { type: integer }
                      remainingIncludedCredits: { type: integer }
                      overageCredits: { type: integer }
                      overageUsdCents: { type: integer }
                      proBuildsUsed: { type: integer }
                      deepBuildsUsed: { type: integer }
                      remainingProBuilds: { type: integer, nullable: true }
                      remainingDeepBuilds: { type: integer, nullable: true }
                      resetsAt: { type: string, format: date-time, nullable: true }
                  org:
                    type: object
                    nullable: true
                    description: >
                      Present when the caller is a seat of a Constellation
                      organization — the shared credit pool replaces the
                      personal plan, card, spend cap and cycle (which are all
                      null for seats).
                    required:
                      [
                        orgId,
                        companyName,
                        role,
                        status,
                        poolCredits,
                        capUsdCents,
                        monthDrawnUsdCents,
                        seatMonthDrawnUsdCents,
                        monthResetsAt,
                      ]
                    properties:
                      orgId: { type: integer }
                      companyName: { type: string }
                      role: { type: string }
                      status: { type: string }
                      poolCredits: { type: integer }
                      capUsdCents: { type: integer }
                      monthDrawnUsdCents: { type: integer }
                      seatCapUsdCents: { type: integer, nullable: true }
                      seatMonthDrawnUsdCents: { type: integer }
                      monthResetsAt: { type: string, format: date-time }
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/usage:
    get:
      operationId: listNabuflowUsage
      tags: [billing]
      summary: Per-build NabuFlow usage ledger (engine mode, deep flag, included-vs-overage attribution)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Usage events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/NabuflowUsageEvent"

  /billing/nabuflow/notifications:
    get:
      operationId: listNabuflowBillingNotifications
      tags: [billing]
      summary: Recent NabuFlow billing notifications (usage warnings, dunning)
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      required: [id, type, title, body]
                      properties:
                        id: { type: integer }
                        type: { type: string }
                        title: { type: string }
                        body: { type: string }
                        metadata:
                          nullable: true
                        createdAt: { type: string, format: date-time, nullable: true }

  /billing/nabuflow/setup-intent:
    post:
      operationId: createNabuflowSetupIntent
      tags: [billing]
      summary: Create a SetupIntent for NabuFlow card capture (card state confirmed via webhooks)
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret, setupIntentId]
                properties:
                  clientSecret: { type: string }
                  setupIntentId: { type: string }
        "503":
          description: Stripe unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/subscribe:
    post:
      operationId: subscribeNabuflowPlan
      tags: [billing]
      summary: Subscribe to a NabuFlow plan (requires a default payment method on file)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, enum: [orbit, comet, nova, constellation] }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                required: [ok, planId, status]
                properties:
                  ok: { type: boolean }
                  planId: { type: string }
                  status: { type: string }
                  currentCycleEnd: { type: string, format: date-time, nullable: true }
        "402":
          description: No valid payment method on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already subscribed — use switch instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/switch:
    post:
      operationId: switchNabuflowPlan
      tags: [billing]
      summary: Switch NabuFlow plan — returns a proration preview unless confirm=true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, enum: [orbit, comet, nova, constellation] }
                confirm: { type: boolean, default: false }
      responses:
        "200":
          description: Proration preview (confirm=false) or switch result (confirm=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    type: object
                    nullable: true
                    description: Immediate proration preview and next-cycle recurring charge when confirm=false.
                    required:
                      - currentPlanId
                      - targetPlanId
                      - amountDueCents
                      - nextCycleAmountCents
                      - nextCycleStartsAt
                      - currency
                      - periodEnd
                      - lines
                    properties:
                      currentPlanId: { type: string }
                      targetPlanId: { type: string }
                      amountDueCents:
                        type: integer
                        description: Immediate proration charge, or credit when negative, in cents.
                      nextCycleAmountCents:
                        type: integer
                        description: Recurring amount for the target plan's next full cycle, in cents.
                      nextCycleStartsAt: { type: string, format: date-time, nullable: true }
                      currency: { type: string }
                      periodEnd: { type: string, format: date-time, nullable: true }
                      lines:
                        type: array
                        items:
                          type: object
                          required: [description, amountCents]
                          properties:
                            description: { type: string, nullable: true }
                            amountCents: { type: integer }
                  ok: { type: boolean }
                  planId: { type: string }
                  status: { type: string }
                  pendingPlanId: { type: string, nullable: true }
                  pendingEffectiveAt: { type: string, format: date-time, nullable: true }
                  upgradedCreditsGranted: { type: integer }
        "404":
          description: No active plan to switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/cancel:
    post:
      operationId: cancelNabuflowSubscription
      tags: [billing]
      summary: Cancel the NabuFlow plan at the end of the current cycle
      responses:
        "200":
          description: Cancellation scheduled
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  cancelsAt: { type: string, format: date-time, nullable: true }
                  message: { type: string }
        "404":
          description: No plan to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/resume:
    post:
      operationId: resumeNabuflowSubscription
      tags: [billing]
      summary: Un-cancel a NabuFlow plan scheduled for cancellation at period end
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: No plan to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/spend-cap:
    post:
      operationId: updateNabuflowSpendCap
      tags: [billing]
      summary: Update the monthly pay-as-you-go spend cap (null reverts to the plan default)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spendCapUsdCents]
              properties:
                spendCapUsdCents: { type: integer, minimum: 0, nullable: true }
      responses:
        "200":
          description: Spend cap updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, effectiveSpendCapUsdCents]
                properties:
                  ok: { type: boolean }
                  spendCapUsdCents: { type: integer, nullable: true }
                  effectiveSpendCapUsdCents: { type: integer }
        "400":
          description: Cap exceeds the tier maximum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org:
    post:
      operationId: registerNabuflowOrg
      tags: [billing]
      summary: Register a Constellation enterprise organization (company-flagged Stripe Customer + shared credit pool; requester becomes billing admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, billingContactEmail, addressLine1, city, postalCode, country]
              properties:
                companyName: { type: string, minLength: 2, maxLength: 200 }
                billingContactName: { type: string, maxLength: 200 }
                billingContactEmail: { type: string, format: email, maxLength: 320 }
                taxId:
                  type: string
                  maxLength: 60
                  description: Tax or VAT identifier printed on company invoices.
                addressLine1: { type: string, minLength: 1, maxLength: 300 }
                addressLine2: { type: string, maxLength: 300 }
                city: { type: string, minLength: 1, maxLength: 120 }
                region: { type: string, maxLength: 120 }
                postalCode: { type: string, minLength: 1, maxLength: 20 }
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 3166-1 alpha-2 country code.
                poReference: { type: string, maxLength: 140 }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                required: [ok, org, role]
                properties:
                  ok: { type: boolean }
                  org: { $ref: "#/components/schemas/NabuflowOrg" }
                  role: { type: string }
        "409":
          description: Caller already belongs to an organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getNabuflowOrg
      tags: [billing]
      summary: Organization billing state for the caller's seat (billing admins also get seats, purchases, ledger and the company card)
      responses:
        "200":
          description: Organization billing state
          content:
            application/json:
              schema:
                type: object
                required: [org, role, month]
                properties:
                  org: { $ref: "#/components/schemas/NabuflowOrg" }
                  role: { type: string }
                  month:
                    type: object
                    required: [drawnUsdCents, capUsdCents, seatDrawnUsdCents, resetsAt]
                    properties:
                      drawnUsdCents: { type: integer }
                      capUsdCents: { type: integer }
                      seatDrawnUsdCents: { type: integer }
                      seatCapUsdCents: { type: integer, nullable: true }
                      resetsAt: { type: string, format: date-time }
                  card:
                    type: object
                    nullable: true
                    properties:
                      brand: { type: string, nullable: true }
                      last4: { type: string, nullable: true }
                      expMonth: { type: integer, nullable: true }
                      expYear: { type: integer, nullable: true }
                  seats:
                    type: array
                    items: { $ref: "#/components/schemas/NabuflowOrgSeat" }
                  purchases:
                    type: array
                    items: { $ref: "#/components/schemas/NabuflowOrgPurchase" }
                  ledger:
                    type: array
                    items: { $ref: "#/components/schemas/NabuflowOrgLedgerEntry" }
        "404":
          description: Caller has no organization seat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateNabuflowOrg
      tags: [billing]
      summary: Update org billing details (PO reference, contact, net-terms days; enabling invoice terms is platform-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                poReference: { type: string, maxLength: 140, nullable: true }
                billingContactName: { type: string, maxLength: 200, nullable: true }
                billingContactEmail: { type: string, format: email, maxLength: 320 }
                termsNetDays: { type: integer, minimum: 1, maximum: 90 }
                invoiceTermsEnabled:
                  type: boolean
                  description: Platform-gated — only the NabuFlow team can enable invoice terms.
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, org]
                properties:
                  ok: { type: boolean }
                  org: { $ref: "#/components/schemas/NabuflowOrg" }
        "403":
          description: Not the billing admin, or terms toggle without platform access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org/pricing:
    get:
      operationId: getNabuflowOrgPricing
      tags: [billing]
      summary: Volume-discount tiers for bulk credit-pool purchases (visible before registration)
      responses:
        "200":
          description: Bulk pricing
          content:
            application/json:
              schema:
                type: object
                required: [minPurchaseCredits, selfServeRateUsdPerCredit, tiers]
                properties:
                  minPurchaseCredits: { type: integer }
                  selfServeRateUsdPerCredit: { type: number }
                  tiers:
                    type: array
                    items:
                      type: object
                      required: [minCredits, usdPerCredit, label]
                      properties:
                        minCredits: { type: integer }
                        usdPerCredit: { type: number }
                        label: { type: string }

  /billing/nabuflow/org/setup-intent:
    post:
      operationId: createNabuflowOrgSetupIntent
      tags: [billing]
      summary: Create a SetupIntent to capture the company card (billing admin only)
      responses:
        "200":
          description: SetupIntent created
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret, setupIntentId]
                properties:
                  clientSecret: { type: string }
                  setupIntentId: { type: string }
        "403":
          description: Not the billing admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org/purchase:
    post:
      operationId: purchaseNabuflowOrgCredits
      tags: [billing]
      summary: Bulk credit-pool purchase at volume rates — card charges now; invoice sends with net terms and funds the pool on payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credits, method]
              properties:
                credits: { type: integer, minimum: 1 }
                method: { type: string, enum: [card, invoice] }
                poReference: { type: string, maxLength: 140 }
      responses:
        "201":
          description: Purchase created (paid immediately on the card path)
          content:
            application/json:
              schema:
                type: object
                required: [ok, purchase, poolCredits]
                properties:
                  ok: { type: boolean }
                  purchase:
                    type: object
                    required: [id, credits, amountUsdCents, method, status, tierLabel, usdPerCredit]
                    properties:
                      id: { type: integer }
                      credits: { type: integer }
                      amountUsdCents: { type: integer }
                      method: { type: string }
                      status: { type: string }
                      tierLabel: { type: string }
                      usdPerCredit: { type: number }
                      hostedInvoiceUrl: { type: string, nullable: true }
                      invoicePdfUrl: { type: string, nullable: true }
                      dueAt: { type: string, format: date-time, nullable: true }
                  poolCredits: { type: integer }
        "400":
          description: Below the bulk minimum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Card declined, or invoice terms not enabled for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org/seats:
    post:
      operationId: addNabuflowOrgSeat
      tags: [billing]
      summary: Add a seat by account email — the seat's builds draw from the shared pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                seatSpendCapUsdCents: { type: integer, minimum: 0, nullable: true }
      responses:
        "201":
          description: Seat added
          content:
            application/json:
              schema:
                type: object
                required: [ok, seat]
                properties:
                  ok: { type: boolean }
                  seat: { $ref: "#/components/schemas/NabuflowOrgSeat" }
        "404":
          description: No account with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: That account already has a seat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org/seats/{seatUserId}:
    delete:
      operationId: removeNabuflowOrgSeat
      tags: [billing]
      summary: Remove a seat (the last billing admin cannot be removed)
      parameters:
        - name: seatUserId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Seat removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Seat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /billing/nabuflow/org/seats/{seatUserId}/cap:
    post:
      operationId: updateNabuflowOrgSeatCap
      tags: [billing]
      summary: Set or clear a per-seat monthly sub-cap (clamped to the org cap at enforcement time)
      parameters:
        - name: seatUserId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatSpendCapUsdCents]
              properties:
                seatSpendCapUsdCents: { type: integer, minimum: 0, nullable: true }
      responses:
        "200":
          description: Seat cap updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, seat]
                properties:
                  ok: { type: boolean }
                  seat: { $ref: "#/components/schemas/NabuflowOrgSeat" }

  /billing/nabuflow/org/spend-cap:
    post:
      operationId: updateNabuflowOrgSpendCap
      tags: [billing]
      summary: Update the org-wide monthly spend cap (null reverts to the Constellation default)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spendCapUsdCents]
              properties:
                spendCapUsdCents: { type: integer, minimum: 0, nullable: true }
      responses:
        "200":
          description: Org spend cap updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, effectiveSpendCapUsdCents]
                properties:
                  ok: { type: boolean }
                  spendCapUsdCents: { type: integer, nullable: true }
                  effectiveSpendCapUsdCents: { type: integer }
        "400":
          description: Cap exceeds the Constellation maximum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /abuse-reports:
    post:
      operationId: submitAbuseReport
      tags: [public]
      summary: Submit an abuse report for a hosted site (public — no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, category, reason]
              properties:
                hostname: { type: string }
                category: { type: string }
                reason: { type: string, minLength: 10, maxLength: 2000 }
                details: { type: string }
                reporterEmail: { type: string, format: email }
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  reportId: { type: integer, nullable: true }
                  message: { type: string }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current user admin status and role
      responses:
        "200":
          description: Admin identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide aggregate stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/launch-readiness:
    get:
      operationId: getAdminLaunchReadiness
      tags: [admin]
      summary: Structured launch readiness checklist
      responses:
        "200":
          description: Launch readiness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLaunchReadiness"

  /admin/roles:
    get:
      operationId: listAdminRoles
      tags: [admin]
      summary: List all role grants
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                required: [roles]
