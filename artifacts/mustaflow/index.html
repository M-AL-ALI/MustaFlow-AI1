<!doctype html>

    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!--
      Apply the saved theme BEFORE first paint to prevent a flash of the light
      (default :root) theme on refresh. Mirrors src/lib/theme.ts: key
      "mf_appearance", default "dark". Must stay in sync with that file.
    -->
    <script>
      (function () {
        var DARK_BG = "hsl(235 45% 6%)";
        var LIGHT_BG = "hsl(235 30% 98%)";
        var el = document.documentElement;
        try {
          var mode = localStorage.getItem("mf_appearance") || "dark";
          // Mirror syncThemeDom() in src/lib/theme.ts exactly: only "light" is
          // light; "system" follows the OS; ANY other value (incl. corrupted
          // storage) falls through to dark.
          var isDark =
            mode !== "light" &&
            (mode !== "system" ||
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          el.classList.toggle("dark", isDark);
          el.style.backgroundColor = isDark ? DARK_BG : LIGHT_BG;
        } catch (e) {
          /* localStorage blocked: fall back to the dark default */
          el.classList.add("dark");
          el.style.backgroundColor = DARK_BG;
        }
      })();
    </script>

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
