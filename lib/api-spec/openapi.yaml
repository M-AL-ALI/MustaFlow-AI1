                      type: object
                      additionalProperties: true

  /admin/skills/drafts/{name}:
    get:
      operationId: getAdminSkillDraft
      tags: [admin]
      summary: Get raw SKILL.md content for a draft skill
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft skill content
          content:
            application/json:
              schema:
                type: object
