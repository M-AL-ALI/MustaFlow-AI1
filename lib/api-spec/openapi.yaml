            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogPage"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/job-queue:
    get:
      operationId: getAdminJobQueue
      tags: [admin]
      summary: pg-boss job queue stats and recent jobs (admin only)
      parameters:
        - { name: recentLimit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Job queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobQueue"

  /admin/support-tickets:
    get:
      operationId: listAdminSupportTickets
      tags: [admin]
      summary: List support tickets for the admin support inbox (filter + search)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, new, open, resolved]
            default: all
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Support ticket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportTicketPage"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/support-tickets/{id}:
    get:
      operationId: getAdminSupportTicket
      tags: [admin]
      summary: Full support ticket detail (transcript + attachments)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Support ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportTicketDetail"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminSupportTicket
      tags: [admin]
      summary: Update a support ticket's status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, open, resolved]
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, status]
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  status: { type: string, enum: [new, open, resolved] }
        "400":
          description: Validation error
          content:
            application/json:
