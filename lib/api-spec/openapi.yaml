                $ref: "#/components/schemas/ApiError"

  /projects/{id}/container/start:
    post:
      operationId: startContainer
      tags: [projects]
      summary: Provision or wake the project container
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Container starting or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/provision/status:
    get:
      operationId: getProjectProvisioningStatus
      tags: [projects]
      summary: Get current provisioning lifecycle for a project (Task #738)
      description: |
        Lightweight polling endpoint the workspace header uses to track the
        provisioning lifecycle (`provisioning → ready → hibernated → error`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current provisioning lifecycle
          content:
            application/json:
              schema:
                type: object
                required: [builderMode, provisioningStatus]
                properties:
                  builderMode: { type: string }
                  provisioningStatus:
                    type: string
                    enum: [idle, provisioning, ready, hibernated, error]
                  provisioningError: { type: string, nullable: true }
                  provisioningStep:
                    type: string
                    nullable: true
                    enum: [create_container, create_database, connect_and_test]
                  estimatedSecondsRemaining: { type: integer, nullable: true }
                  containerStatus: { type: string, nullable: true }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/provision/retry:
    post:
      operationId: retryProjectProvisioning
      tags: [projects]
      summary: Re-run the auto-provisioning pipeline for a project (Task #738)
      description: |
        Idempotent: skips container creation if `containerId` is set and skips
        Neon Postgres creation if `neonProjectId` is set. Use when
        `provisioningStatus` is "error".
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Provisioning job re-enqueued
          content:
            application/json:
              schema:
                type: object
                required: [provisioningStatus]
                properties:
                  provisioningStatus:
                    type: string
                    enum: [provisioning]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Provisioning already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/container/stop:
    post:
      operationId: stopContainer
      tags: [projects]
      summary: Hibernate the project container
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Container hibernated
          content:
            application/json:
              schema:
                type: object
                required: [containerStatus]
                properties:
                  containerStatus: { type: string }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/queue:
    post:
      operationId: submitProjectQueue
      tags: [projects]
      summary: Submit a batch of messages to the project task queue
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages, agentMode]
              properties:
                messages:
                  type: array
                  items: { type: string }
                agentMode: { type: string }
                planMode: { type: boolean }
                agentIdentity:
                  type: string
                  enum: [planning, task, main]
                  description: "Legacy client hint. Queued build work executes through Main Agent; task is accepted only for backward compatibility."
      responses:
        "200":
          description: Queue batch created
          content:
            application/json:
              schema:
                type: object
                required: [batchId, taskIds, totalTasks]
                properties:
                  batchId: { type: string }
                  taskIds:
                    type: array
                    items: { type: integer }
                  totalTasks: { type: integer }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/queue/resume-paused:
    post:
      operationId: resumePausedQueue
      tags: [projects]
      summary: Resume tasks paused due to insufficient credits (called after a top-up)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Paused tasks resumed
          content:
            application/json:
              schema:
                type: object
                required: [resumed]
                properties:
                  resumed: { type: integer }

  /projects/{id}/queue/{batchId}:
    get:
      operationId: getProjectQueueBatch
      tags: [projects]
      summary: Get status and tasks for a queue batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    batchId,
                    projectId,
                    tasks,
                    totalCount,
                    completedCount,
                    failedCount,
                    cancelledCount,
                  ]
                properties:
                  batchId: { type: string }
                  projectId: { type: integer }
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentTask"
                  totalCount: { type: integer }
                  completedCount: { type: integer }
                  failedCount: { type: integer }
                  cancelledCount: { type: integer }
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: cancelProjectQueueBatch
      tags: [projects]
      summary: Cancel all queued (not yet running) tasks in a batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tasks cancelled
          content:
            application/json:
              schema:
                type: object
                required: [cancelled, batchId]
                properties:
                  cancelled: { type: integer }
                  batchId: { type: string }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/container/logs:
    get:
      operationId: getContainerLogs
      tags: [projects]
      summary: Get recent container log lines for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
