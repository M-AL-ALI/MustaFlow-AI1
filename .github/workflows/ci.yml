name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  prompt-evals:
    # Task #545 — Run prompt evals when builder.ts / architect.ts / the eval
    # harness itself change. Skips automatically when the OpenAI API key isn't
    # configured (forks / dependabot), so we never block merges on missing keys.
    name: Prompt Evals (Task #545)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect prompt-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -E '^(artifacts/api-server/src/lib/(builder|architect)\.ts|scripts/src/eval-prompts\.ts)$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run prompt evals
        if: steps.changed.outputs.run == 'true' && env.AI_INTEGRATIONS_OPENAI_API_KEY != ''
        env:
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
        run: pnpm --filter @workspace/scripts run eval-prompts

      - name: Upload eval results
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: scripts/eval-results/latest.json
          if-no-files-found: ignore
