openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MustaFlow AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: User projects (apps being built)
  - name: chat
    description: AI builder chat messages
  - name: tasks
    description: Background and main agent tasks
  - name: versions
    description: Project versions and rollback points
  - name: knowledge
    description: Knowledge Vault entries
  - name: secrets
    description: Project secrets (masked)
  - name: openai
    description: OpenAI AI chat operations
  - name: workspaces
    description: User workspaces (containers for projects)
  - name: credits
    description: User credits and billing
  - name: builds
    description: EAS mobile cloud builds (iOS / Android)
  - name: admin
    description: Admin-only platform management endpoints
  - name: billing
    description: Billing aliases and Stripe webhook
  - name: suggestions
    description: AI-generated post-build next-step suggestions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List user workspaces (auto-creates default if empty)
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /projects/summary:
    get:
      operationId: getProjectsSummary
      tags: [projects]
      summary: Dashboard aggregate counts
      responses:
        "200":
          description: Counts of projects by status and type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummary"

  /projects/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Messages in builder chat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to the AI builder. Returns the saved user + assistant messages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: User and assistant messages persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatExchange"

  /projects/{id}/tasks/{taskId}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: Live event stream for a task (poll every 1-2 s)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Events emitted so far for this task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of tasks for a project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Queue a new background agent task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"

  /projects/{id}/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel a queued auto-fix task before it runs
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Task is already running or completed and cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/tasks/{taskId}/apply:
    post:
      operationId: applyTaskStaging
      tags: [tasks]
      summary: Apply Task Agent staging snapshot to live project files
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Staging snapshot applied — files are now live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Task is not in needs_review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/tasks/{taskId}/discard:
    post:
      operationId: discardTaskStaging
      tags: [tasks]
      summary: Discard Task Agent staging snapshot — no files changed
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Staging snapshot discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Task is not in needs_review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/agent-routing:
    get:
      operationId: getAgentRouting
      tags: [projects]
      summary: Get recommended agent identity for a prompt
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: prompt, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Recommended agent and reason
          content:
            application/json:
              schema:
                type: object
                required: [agentIdentity, reason]
                properties:
                  agentIdentity:
                    type: string
                    enum: [planning, task, main]
                  reason:
                    type: string

  /projects/{id}/tasks/{taskId}/feedback:
    patch:
      operationId: submitTaskFeedback
      tags: [tasks]
      summary: Submit thumbs up or down feedback on a task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/versions:
    get:
      operationId: listVersions
      tags: [versions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectVersion"
    post:
      operationId: createVersion
      tags: [versions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectVersionInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVersion"

  /projects/{id}/versions/{versionId}:
    patch:
      operationId: patchVersion
      tags: [versions]
      summary: Rename a version checkpoint label
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVersionBody"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getVersion
      tags: [versions]
      summary: Get a single version including full files snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Version detail with files snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVersionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/versions/{versionId}/rollback:
    post:
      operationId: rollbackVersion
      tags: [versions]
      summary: Restore the project files to a saved version snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Rollback applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResult"

  /projects/{id}/audit:
    get:
      operationId: getProjectAudit
      tags: [projects]
      summary: Get the latest code quality audit report for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Latest audit report from the most recent project version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAuditResult"
        "404":
          description: No audit report found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: List generated files for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFileSummary"
    post:
      operationId: createProjectFile
      tags: [projects]
      summary: Create a new file in the project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileCreate"
      responses:
        "201":
          description: Created file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "409":
          description: File path already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/files/{fileId}:
    get:
      operationId: getProjectFile
      tags: [projects]
      summary: Get the contents of one generated file by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProjectFile
      tags: [projects]
      summary: Update the contents of a generated file
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileUpdate"
      responses:
        "200":
          description: Updated file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProjectFile
      tags: [projects]
      summary: Delete a project file by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/files/{fileId}/rename:
    patch:
      operationId: renameProjectFile
      tags: [projects]
      summary: Rename (move) a project file to a new path
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fileId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileRename"
      responses:
        "200":
          description: Renamed file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A file with that path already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Masked secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecretEntry"
    post:
      operationId: createSecret
      tags: [secrets]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretEntry"

  /projects/{id}/duplicate:
    post:
      operationId: duplicateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Duplicated project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateProjectResult"

  /projects/{id}/page-map:
    get:
      operationId: getPageMap
      tags: [projects]
      summary: Get the page/screen flow map for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Page map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"
    put:
      operationId: putPageMap
      tags: [projects]
      summary: Save the page/screen flow map for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageMapData"
      responses:
        "200":
          description: Updated page map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"

  /projects/{id}/page-map/analyze:
    post:
      operationId: analyzePageMap
      tags: [projects]
      summary: Re-run AI extraction on project files and update the page map
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - in: query
          name: platform
          schema: { type: string, enum: [web, ios, android], default: web }
      responses:
        "200":
          description: Updated page map after AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMapResponse"

  /projects/{id}/publish:
    post:
      operationId: publishProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Publish result with public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"

  /projects/{id}/unpublish:
    post:
      operationId: unpublishProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project unpublished
          content:
            application/json:
              schema:
                type: object
                required: [projectId, status]
                properties:
                  projectId: { type: integer }
                  status: { type: string }

  /projects/{id}/deploy:
    post:
      operationId: deployProject
      tags: [projects]
      summary: Deploy project to production (blue/green container swap + DB snapshot)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deploy result with public URL and container info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          description: No files to deploy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Readiness checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/analytics:
    get:
      operationId: getProjectAnalytics
      tags: [projects]
      summary: Build analytics rows and summary for a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalyticsResponse"

  /projects/{id}/publish-readiness:
    get:
      operationId: getPublishReadiness
      tags: [projects]
      summary: Automated pre-publish readiness checks
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - in: query
          name: env
          schema: { type: string, enum: [testing, production], default: testing }
      responses:
        "200":
          description: Readiness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResult"

  /projects/{id}/mobile-settings:
    get:
      operationId: getMobileAppSettings
      tags: [projects]
      summary: Read current mobile app.json settings
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current settings (empty strings when app.json not yet generated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAppSettings"
        "400":
          description: Not a mobile project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: saveMobileAppSettings
      tags: [projects]
      summary: Update mobile app.json settings (app name, bundle ID, package name, version, splash color)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileAppSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAppSettings"
        "400":
          description: Validation error
          content:
