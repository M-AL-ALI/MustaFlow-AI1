        description: { type: string }
        status:
          type: string
          enum: [pass, fail, warning, info]
        severity:
          type: string
          enum: [blocking, warning, info]
        message: { type: string }

    ReadinessResult:
      type: object
      required: [env, canPublish, checks]
      properties:
