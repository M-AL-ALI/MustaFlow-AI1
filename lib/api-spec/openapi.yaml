  /vault/search/semantic:
    post:
      operationId: semanticSearchVault
      tags: [vault]
      summary: >
        Semantic search across the authenticated user's Knowledge Vault entries
        using pgvector cosine similarity. The user query is embedded;
        stored chunk embeddings are compared. No RAG, no AI answer generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSemanticSearchRequest"
      responses:
        "200":
          description: Semantic search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSemanticSearchResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Rate limit exceeded (max 30 per hour)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

