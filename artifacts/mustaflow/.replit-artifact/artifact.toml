kind = "web"
previewPath = "/"
title = "MustaFlow AI"
version = "1.0.0"
id = "artifacts/mustaflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20279

[services.development]
run = "pnpm --filter @workspace/mustaflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mustaflow", "run", "build" ]
publicDir = "artifacts/mustaflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20279"
BASE_PATH = "/"
