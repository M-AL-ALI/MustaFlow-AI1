      properties:
        projectId: { type: integer }
        status: { type: string }
        publicSlug: { type: string }
        publicUrl: { type: string }
        publishedAt: { type: string, format: date-time }
        note: { type: string }

    ActivityItem:
      type: object
      required: [id, projectId, projectName, kind, summary, createdAt]
      properties:
        id: { type: string }
        projectId: { type: integer }
        projectName: { type: string }
        kind:
          type: string
          enum: [message, task, version, project]
        summary: { type: string }
        createdAt: { type: string, format: date-time }

    ReadinessCheck:
      type: object
      required: [id, label, description, status, severity]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [pass, fail, warning, info]
        severity:
          type: string
