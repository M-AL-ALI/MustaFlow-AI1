name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  prompt-evals:
    # Task #545 — Run prompt evals when builder.ts / architect.ts / the eval
    # harness itself change. Skips automatically when the OpenAI API key isn't
    # configured (forks / dependabot), so we never block merges on missing keys.
    name: Prompt Evals (Task #545)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect prompt-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -E '^(artifacts/api-server/src/lib/(builder|architect)\.ts|scripts/src/eval-prompts\.ts)$' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run prompt evals
        if: steps.changed.outputs.run == 'true' && env.AI_INTEGRATIONS_OPENAI_API_KEY != ''
        env:
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
        run: pnpm --filter @workspace/scripts run eval-prompts

      - name: Upload eval results
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: scripts/eval-results/latest.json
          if-no-files-found: ignore

  # ── Task #753 — Stop-button browser e2e ──────────────────────────────────────
  # Exercises the full click → handleCancel → POST /cancel → SSE cancelled path
  # in a real Chromium browser.  Requires Clerk + database secrets; mirrors the
  # pattern in prompt-evals: CI runs the full suite, forks/bots skip gracefully.
  e2e-stop-button:
    name: E2E — Stop-button cancel flow (Task #753)
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mustaflow_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustaflow_e2e
      # Non-sensitive CI values — safe placeholders for keys that are never
      # used for real crypto when the auth bypass is active.
      SESSION_SECRET: ci-only-session-secret-not-for-production
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      NODE_ENV: test
      # E2E flags — enable header-based auth bypass and slow builder stub.
      E2E_TEST_ENABLED: "true"
      DEV_SLOW_BUILD_DELAY_MS: "15000"
      BASE_PATH: "/"
      # CI-only placeholders needed to boot modules that validate env at import
      # time. The slow builder stub keeps this E2E path from calling OpenAI.
      AI_INTEGRATIONS_OPENAI_BASE_URL: https://example.invalid/v1
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-placeholder-not-used
      # Clerk keys — required to start ClerkProvider in the frontend.
      # Add CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, VITE_CLERK_PUBLISHABLE_KEY
      # to GitHub repo secrets.  The x-e2e-test-user bypass means Clerk never
      # validates a real token, but the SDK still needs a well-formed key at init.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ZGV2LWNpLXRlc3QuY2xlcmsuYWNjb3VudHMuZGV2JA==' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Enable pgvector extension
        run: |
          container_id="$(docker ps --filter "name=postgres" --format "{{.ID}}" | head -n 1)"
          docker exec "$container_id" psql -U postgres -d mustaflow_e2e -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Push database schema
        run: pnpm --filter @workspace/db run push

      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Start API server (background, port 8080)
        run: |
          PORT=8080 node --enable-source-maps artifacts/api-server/dist/index.mjs &
          echo $! > /tmp/api.pid

      - name: Start Vite dev server (background, port 5173)
        working-directory: artifacts/mustaflow
        run: |
          PORT=5173 pnpm exec vite --config vite.config.ts --host 0.0.0.0 --port 5173 &
          echo $! > /tmp/vite.pid

      # Nginx reverse-proxies port 80: /api → :8080, / → :5173 so the Playwright
      # spec can use a single E2E_BASE_URL (http://localhost:80) as in dev.
      - name: Configure nginx reverse proxy
        run: |
          sudo tee /etc/nginx/sites-available/e2e <<'NGINX'
          server {
            listen 80;
            location /api {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_buffering off;
            }
            location / {
              proxy_pass http://127.0.0.1:5173;
              proxy_set_header Host $host;
            }
          }
          NGINX
          sudo ln -sf /etc/nginx/sites-available/e2e /etc/nginx/sites-enabled/e2e
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo nginx -s reload || { sudo rm -f /run/nginx.pid; sudo nginx; }

      - name: Wait for services to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80/api/healthz; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done
          echo "Waiting for Vite..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:80/ | grep -q "MustaFlow\|<div id"; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run Stop-button Playwright test
        run: npx playwright test e2e/stop-button.spec.ts --reporter=line
        env:
          E2E_BASE_URL: http://localhost:80

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stop-button
          path: test-results/
          if-no-files-found: ignore
