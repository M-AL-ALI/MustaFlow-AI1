      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        status: { type: string }
        ownerId: { type: string }
        filesCount: { type: integer }
        secretsCopied: { type: boolean }
        note: { type: string }

    PublishResult:
      type: object
