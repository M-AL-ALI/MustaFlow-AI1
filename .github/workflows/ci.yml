name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  prompt-evals:
    # The deterministic manifest always runs. A changed release head must also
    # produce a fresh named semantic result for its exact Git and manifest IDs.
    name: Zero Guidance Evals
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The push event's `before` SHA may be several commits behind when a
          # reviewed slice is fast-forwarded as a multi-commit chain.  The
          # change detector must be able to inspect that exact object.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated instruction manifest
        run: |
          pnpm --filter @workspace/scripts run zero-guidance:check
          pnpm --filter @workspace/scripts run zero-guidance:test

      - name: Detect instruction-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN="$(pnpm --silent --filter @workspace/scripts run zero-guidance:changed -- --base "$BASE" --head "$HEAD" | tail -n 1)"
          test "$RUN" = "true" || test "$RUN" = "false"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      # The production AI integration is network-bound to the governed Replit
      # environment.  That environment evaluates the exact code commit and a
      # receipt-only child commit carries the bounded result into GitHub.  The
      # validator accepts that one-file child and rejects any lookalike with an
      # additional changed path.
      - name: Validate the governed live-eval receipt
        if: github.ref == 'refs/heads/main' && steps.changed.outputs.run == 'true'
        run: >-
          pnpm --filter @workspace/scripts run zero-guidance:validate-live --
          --result scripts/eval-results/zero-guidance-latest.json
          --head "${{ github.sha }}"

      - name: Upload eval results
        if: always() && github.ref == 'refs/heads/main' && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zero-guidance-eval-${{ github.sha }}
          path: |
            scripts/eval-results/zero-guidance-latest.json
          if-no-files-found: ignore

  # ── Task #753 — Stop-button browser e2e ──────────────────────────────────────
  # Exercises the full click → handleCancel → POST /cancel → SSE cancelled path
  # in a real Chromium browser.  Requires Clerk + database secrets; mirrors the
  # pattern in prompt-evals: CI runs the full suite, forks/bots skip gracefully.
  e2e-stop-button:
    name: E2E — Stop-button cancel flow (Task #753)
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mustaflow_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustaflow_e2e
      # Non-sensitive CI value; SESSION_SECRET is not a cryptographic key.
      SESSION_SECRET: ci-only-session-secret-not-for-production
      # Real AES-256-GCM key from GitHub secrets so E2E project-secret tests
      # exercise actual encryption rather than the plaintext passthrough path.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      NODE_ENV: development
      # E2E flags — enable header-based auth bypass and slow builder stub.
      E2E_TEST_ENABLED: "true"
      DEV_SLOW_BUILD_DELAY_MS: "15000"
      # Clerk keys — required to start ClerkProvider in the frontend.
      # Add CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, VITE_CLERK_PUBLISHABLE_KEY
      # to GitHub repo secrets.  The x-e2e-test-user bypass means Clerk never
      # validates a real token, but the SDK still needs a well-formed key at init.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Push database schema
        run: pnpm --filter @workspace/db run push

      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Start API server (background, port 8080)
        run: |
          PORT=8080 node --enable-source-maps artifacts/api-server/dist/index.mjs &
          echo $! > /tmp/api.pid

      - name: Start Vite dev server (background, port 5173)
        working-directory: artifacts/mustaflow
        run: |
          PORT=5173 pnpm exec vite --config vite.config.ts --host 0.0.0.0 --port 5173 &
          echo $! > /tmp/vite.pid

      # Nginx reverse-proxies port 80: /api → :8080, / → :5173 so the Playwright
      # spec can use a single E2E_BASE_URL (http://localhost:80) as in dev.
      - name: Configure nginx reverse proxy
        run: |
          sudo tee /etc/nginx/sites-available/e2e <<'NGINX'
          server {
            listen 80;
            location /api {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_buffering off;
            }
            location / {
              proxy_pass http://127.0.0.1:5173;
              proxy_set_header Host $host;
            }
          }
          NGINX
          sudo ln -sf /etc/nginx/sites-available/e2e /etc/nginx/sites-enabled/e2e
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo nginx -s reload

      - name: Wait for services to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80/api/healthz; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done
          echo "Waiting for Vite..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:80/ | grep -q "MustaFlow\|<div id"; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run Stop-button Playwright test
        run: npx playwright test e2e/stop-button.spec.ts --reporter=line
        env:
          E2E_BASE_URL: http://localhost:80

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stop-button
          path: test-results/
          if-no-files-found: ignore
