          type: string
          enum: [personal, business, client, team]

    Project:
      type: object
      required: [id, name, kind, status, agentMode, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workspaceId: { type: ["integer", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        kind:
          type: string
          enum:
            [
              web,
              mobile-ios,
              mobile-android,
              mobile-cross,
              fullstack,
              dashboard,
              api,
              design,
              automation,
              marketplace,
              chatbot,
              spreadsheet,
            ]
        platform:
          type: string
          enum: [web, ios, android, cross]
        status:
          type: string
          enum: [draft, building, testing, published, failed]
        agentMode:
          type: string
          enum: [lite, eco, power, pro]
        policyStrictness:
          type: string
          enum: [safe, standard, permissive]
          description: "Controls the agent loop's command policy. safe = legacy whitelist; standard (default) = broad allow + deny-list; permissive = admin-only, skips registry allowlist."
        deletedAt:
          {
            type: ["string", "null"],
            format: date-time,
            description: "Soft-delete timestamp. Present only on /projects/trash responses; null/omitted for active projects.",
          }
        lastTaskSummary: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        publicSlug: { type: ["string", "null"] }
        siteTitle: { type: ["string", "null"] }
        metaDescription: { type: ["string", "null"] }
        themeColor: { type: ["string", "null"] }
        mobilePreviewUrl: { type: ["string", "null"] }
        containerId:
          {
            type: ["string", "null"],
            description: "Fly.io Machine ID for this project's dev container. Null = not provisioned.",
          }
        containerStatus:
          type: string
          enum: [stopped, starting, running, hibernated, error]
          description: "Current dev container lifecycle state."
        containerUrl:
          {
            type: ["string", "null"],
            description: "Proxy URL to reach the container's dev server.",
          }
        prodContainerId:
          {
            type: ["string", "null"],
            description: "Fly.io Machine ID for the live production container. Null = not deployed.",
          }
        prodContainerStatus:
          type: string
          enum: [stopped, starting, running, hibernated, error, deploying]
          description: "Current production container lifecycle state."
        prodContainerUrl:
          {
            type: ["string", "null"],
            description: "Proxy URL to reach the production container. Null = not deployed.",
          }
        healthScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
          description: "0–100 score derived from generated file quality: accessibility (alt/ARIA/semantic), SEO (title/description/h1), performance (script count/lazy), security (no eval/document.write). Null if no files built yet."
        defaultAgent:
          type: string
          enum: [planning, task, main]
          description: "User's preferred visible executor for this project. planning = Planner, main = Main Agent, task = legacy compatibility."
        projectFormat:
          type: string
          enum: [static-html, react-vite]
          description: "Builder output format. static-html = CDN-based single HTML blob (legacy). react-vite = multi-file React + Vite npm project (default for new web projects)."
        stack:
          type: string
          enum: [static-html, react-vite, nextjs, node-api, python-flask, python-fastapi, go-gin]
          description: "Technology stack chosen at project creation. Immutable — duplicate the project to change stack."
        stackLocked:
          type: boolean
          description: "True when the user explicitly selected the technology stack at project creation. False keeps first-build automatic architecture detection available."
        dbProvider:
          type: string
          enum: [none, postgres, sqlite]
          description: "Which database engine is provisioned for this project. none = no DB."
        dbStatus:
          type: string
          enum: [none, provisioning, connected, error]
          description: "Current database lifecycle state."
        dbConnectionId:
          type: ["string", "null"]
          description: "Opaque identifier for the provisioned database (e.g. Neon project ID). Null = not provisioned."
        builderMode:
          type: string
          enum: [static-legacy, agentic]
          description: "Task #738. 'agentic' = project was created with auto-provisioned Fly container + Neon Postgres. 'static-legacy' = legacy in-DB static-HTML projects."
        neonProjectId:
          type: ["string", "null"]
          description: "Neon Postgres project id captured at provision time. Null = not provisioned (or non-agentic project)."
        provisioningStatus:
          type: string
          enum: [idle, provisioning, ready, hibernated, error]
          description: "Lifecycle of the auto-provision background job (Task #738)."
        provisioningError:
          type: ["string", "null"]
          description: "Most recent provisioning error message, or null when last attempt succeeded."
        previewDbStatus:
          type: string
          enum: [none, provisioning, ready, error]
          description: "Task #767. Lifecycle of the preview-environment Neon Postgres DB provisioning."
        blockPublishOnCritical:
          type: boolean
          description: "When true, the publish readiness gate blocks publishing if any unresolved critical (error-severity) security findings exist from the latest check run. Default true."
        dismissedFindingHashes:
          type: array
          items: { type: string }
          description: "Array of dismissed finding keys (file:line:message). Dismissed findings are excluded from the publish security gate."
          nullable: true
        autoFixOnCheckFailure:
          type: boolean
          description: "When true, a refine task is automatically enqueued after any build that has failing checks. Auto-fix fires at most once per build and never on auto-fix tasks themselves."
        autoFixWarningsAfterBuild:
          type: boolean
          description: "When true, the build pipeline runs project-wide ESLint auto-fix at the end of every successful build (before the version snapshot is taken). Default false."
        architectReviewEnabled:
          type: boolean
          description: "When true, a second-opinion architect review runs after every successful build/refine. Critical or fail verdicts trigger one auto-fix turn. Charged as a separate flat fee (2 credits). Default true — opt-out per project."
        e2eEnabled:
          type: boolean
          description: "When true, the agentic builder automatically runs Playwright smoke E2E after every successful web build, and the run_e2e tool is available to the model. Default true."
        multiplayerEnabled:
          type: boolean
          description: "When true, the project accepts real-time multiplayer presence/edit broadcasts on WS /api/projects/{id}/multiplayer. Default false — opt-in per project."
        redirectWwwApex:
          type: boolean
          description: "When true, requests to www.<apex> are 301-redirected to the apex domain (or vice versa). Only meaningful when both apex and www are attached as project domains."
        scannerSemgrepEnabled:
          type: boolean
          description: "When true, Semgrep SAST runs on every build (Task #545). Default true."
        scannerHoundDogEnabled:
          type: boolean
          description: "When true, the HoundDog secret/PII scanner runs on every build (Task #545). Default false."
        scannerTrivyEnabled:
          type: boolean
          description: "When true, the Trivy CVE/IaC scanner runs on every build (Task #545). Default false."
        requireCommandApproval:
          type: boolean
          description: "When true, the agent pauses before run_command or pkg_install and asks the user to approve or reject. Default false."
        stagingPublishedSnapshotId:
          type: ["integer", "null"]
          description: "Version ID currently live on the staging slot. Null = not staged. Set by POST /publish?env=staging, promoted by POST /promote."
        testingStatus:
          type: string
          enum: [idle, stale, ready, passed]
          description: "Task #768. State of the test-then-publish workflow. idle=no test run yet, stale=draft changed after last test, ready=test container healthy and awaiting approval, passed=test approved and ready to publish."
        testingCandidateSnapshotId:
          type: ["integer", "null"]
          description: "Task #768. Version ID of the current immutable test candidate snapshot. Null = no candidate. Set by /preview-env/start."
        testedSnapshotId:
          type: ["integer", "null"]
          description: "Task #768. Version ID of the most recently approved test snapshot. The publish route uses this as the source snapshot automatically when no versionId is specified."
        testContainerStatus:
          type: ["string", "null"]
          enum: [stopped, starting, running, hibernated, error, null]
          description: "Task #768. Current status of the test container. Null when no container has been started."
        runningTestSnapshotId:
          type: ["integer", "null"]
          description: "Task #768. Version ID currently running inside the test container. Used to detect stale containers after a rebuild."
        activePreviewSessionId:
          type: ["string", "null"]
          description: "Task #768. ULID of the currently active preview session cookie (used by the subdomain gateway)."
        previewDbUrl:
          type: ["string", "null"]
          description: "Task #767/768. Encrypted Neon Postgres connection string for the test-environment database. Never returned plaintext."
        chipLabel:
          type: ["string", "null"]
          description: "Name of the capability chip used when the project was created (e.g. 'React SaaS app'). Null when no chip was used."
        projectMode:
          type: string
          enum: [builder, developer]
          description: "Surface that created this project. 'builder' = AI Build Mode (default). 'developer' = Developer Mode cloud IDE (Task #898). Immutable after creation."
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

