        updatedAt: { type: string, format: date-time }

    StreamSessionEvent:
      type: object
      description: >
        First event emitted on every new converse stream. Carries a session ID the client
        must store and pass to `GET /projects/{id}/messages/stream/resume` if the connection
        drops before the terminal `done` or `error` event arrives.
      required: [type, streamSessionId]
      properties:
        type:
          type: string
          enum: [session]
        streamSessionId:
          type: string
          description: >
            UUID identifying this stream session. Valid for 10 minutes after stream start.
            Pass as the `sessionId` query param on the resume endpoint.

    StreamTokenEvent:
      type: object
      description: Emitted for each incremental text chunk streamed from the AI model.
      required: [type, content]
      properties:
        type:
          type: string
          enum: [token]
          description: Discriminant field identifying this as a token frame.
        content:
          type: string
          description: The incremental text chunk to append to the in-progress assistant message.

    StreamDoneEvent:
      type: object
      description: >
        Emitted once when the stream is complete. Carries the persisted message IDs so the
        client can reconcile optimistic UI state, plus an optional structured plan payload
        rendered as a plan card when the intent is "plan".
      required: [type, userMessageId, assistantMessageId]
      properties:
        type:
          type: string
          enum: [done]
          description: Discriminant field identifying this as a done frame.
        userMessageId:
          type: integer
          description: Database ID of the persisted user chat message.
        assistantMessageId:
          type: integer
          description: Database ID of the persisted assistant chat message.
        plan:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Structured plan payload present when the resolved intent produces a plan card.
            Shape varies by kind:
            `{kind:"converse", taskId, intent?, streaming}` — standard conversational reply with task reference;
            `{kind:"clarifying", taskId, question, options, streaming?}` — AI needs clarification before proceeding;
            `{kind:"task-queued", taskId}` — build/refine was queued (background agent);
            `{kind:"task-done", taskId}` — build/refine completed inline;
            `{kind:"error", message}` — pipeline failed after stream start.
            Null or absent when there is no structured plan (pure conversational reply).

    StreamFallbackEvent:
      type: object
      description: >
        Emitted when the resolved intent is not a converse-family intent (i.e. "build" or "plan")
        and the stream endpoint cannot handle the request itself. The client must re-send the
        message via POST /projects/{id}/messages using the regular non-streaming path.
      required: [type, intent]
      properties:
        type:
          type: string
          enum: [fallback]
          description: Discriminant field identifying this as a fallback frame.
        intent:
          type: string
          enum: [build, plan]
          description: >
            The resolved intent that triggered the fallback. Always "build" or "plan" —
            converse-family intents (converse, debug, refactor, review, explain) are never
            redirected and always stream their response directly.

    StreamErrorEvent:
      type: object
      description: >
        Emitted when an unrecoverable error occurs during streaming (e.g. AI provider failure,
        database write error). The stream terminates immediately after this frame.
        When the error occurred after the assistant message was persisted to the DB,
        `userMessageId` and `assistantMessageId` are also present so the client can
        reconcile optimistic UI state even on failure.
      required: [type, message]
      properties:
        type:
          type: string
          enum: [error]
          description: Discriminant field identifying this as an error frame.
        message:
          type: string
          description: Human-readable error description suitable for display in the chat UI.
        userMessageId:
          type: integer
          nullable: true
          description: >
            Database ID of the persisted user chat message. Present when the user message
            was written to the DB before the error occurred; absent or null otherwise.
        assistantMessageId:
          type: integer
          nullable: true
          description: >
            Database ID of the persisted assistant error message. Present when the
            fallback error assistant message was successfully written to the DB
            before the stream terminated; absent or null otherwise.

