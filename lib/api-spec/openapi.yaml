          type: string
          enum: [hosted, embedded]
          description: Stripe Checkout UI mode. "embedded" returns a clientSecret; "hosted" (default) returns a checkoutUrl for full-page redirect.
        successUrl:
          type: string
          description: Required when uiMode is "hosted"; ignored for "embedded".
        cancelUrl:
          type: string
          description: Required when uiMode is "hosted"; ignored for "embedded".
        returnUrl:
          type: string
          description: Optional return URL for embedded mode (used after payment completion). When omitted, the checkout stays in-place and the client handles success via webhook + refetch.

