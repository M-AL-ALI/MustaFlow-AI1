        summary: { type: string }
        createdAt: { type: string, format: date-time }

    ReadinessCheck:
      type: object
      required: [id, label, description, status, severity]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [pass, fail, warning, info]
        severity:
          type: string
          enum: [blocking, warning, info]
        message: { type: string }

    ReadinessResult:
      type: object
      required: [env, canPublish, checks]
      properties:
        env: { type: string }
        canPublish: { type: boolean }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    SecretVerifyResult:
      type: object
      required: [secretId, status, message]
      properties:
        secretId: { type: integer }
        status:
          type: string
          enum: [verified, verification_failed, manual_required]
        message: { type: string }

    DeploymentLog:
      type: object
      required: [id, projectId, userId, env, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        userId: { type: string }
        env: { type: string }
        status: { type: string }
        publicSlug: { type: ["string", "null"] }
        publicUrl: { type: ["string", "null"] }
        filesCount: { type: ["integer", "null"] }
        snapshotVersionId: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }
        buildId: { type: ["string", "null"] }
        platform: { type: ["string", "null"] }
        downloadUrl: { type: ["string", "null"] }
        testflightUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    MobileBuildInput:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [ios, android]

    MobileBuildQueued:
      type: object
      required: [ok, buildLogId, platform, status, note]
      properties:
        ok: { type: boolean }
        buildLogId: { type: integer }
        platform: { type: string }
        status: { type: string }
        note: { type: string }

    MobileBuildLog:
      type: object
      required: [id, projectId, userId, env, status, platform, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        userId: { type: string }
        env: { type: string }
        status: { type: string }
        platform: { type: ["string", "null"] }
        buildId: { type: ["string", "null"] }
        downloadUrl: { type: ["string", "null"] }
        testflightUrl: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    MobileBuildLogsResult:
      type: object
      required: [status]
      properties:
        buildId: { type: ["string", "null"] }
        status: { type: string }
        platform: { type: ["string", "null"] }
        downloadUrl: { type: ["string", "null"] }
        testflightUrl: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        logs: { type: string }

    UserCredit:
      type: object
      required: [userId, balance, updatedAt]
      properties:
        userId: { type: string }
        balance: { type: integer }
        updatedAt: { type: string, format: date-time }

    PageMapNode:
      type: object
      required: [id, label, pageType, filePath, position, isNew, hasError, aiGenerated, notes]
      properties:
        id: { type: string }
        label: { type: string }
