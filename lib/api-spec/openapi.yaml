        projectId: { type: integer }
        status: { type: string }
        publicSlug: { type: string }
        publicUrl: { type: string }
        internalPathUrl: { type: string }
        publishedAt: { type: string, format: date-time }
        snapshotVersionId: { type: integer }
        filesPublished: { type: integer }
        containerDeployed:
          {
            type: boolean,
            description: "True when a production container was provisioned instead of (or alongside) the static snapshot.",
          }
