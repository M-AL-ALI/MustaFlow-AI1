      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "404":
          description: Record not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /projects/{id}/domains/{domainId}/certificate:
    post:
      operationId: uploadProjectDomainCertificate
      tags: [projects]
      summary: Upload a BYO TLS certificate and private key
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate, privateKey]
              properties:
                certificate:
                  { type: string, description: PEM certificate bundle (leaf + intermediates) }
                privateKey: { type: string, description: PEM private key }
      responses:
        "200":
          description: Certificate uploaded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  cfUploaded: { type: boolean }
                  byoCertExpiresAt: { type: string, nullable: true }
                  byoCertSubject: { type: string, nullable: true }
                  sslStatus: { type: string, nullable: true }
                  message: { type: string, nullable: true }
        "400":
          description: Invalid certificate or key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: Cloudflare rejected the certificate upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
