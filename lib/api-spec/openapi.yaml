      operationId: removeProjectDomainCertificate
      tags: [projects]
      summary: Remove the BYO TLS certificate and revert to Cloudflare-managed SSL
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Certificate removed
          content:
            application/json:
              schema:
                type: object
