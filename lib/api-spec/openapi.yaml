          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project or package.json not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/packages/uninstall:
    post:
      operationId: uninstallPackage
      tags: [projects]
      summary: Uninstall an npm package from the project (runs npm uninstall in container if running, updates package.json in DB)
      parameters:
