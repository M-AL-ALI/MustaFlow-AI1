        status: { type: string }
        publicSlug: { type: string }
        publicUrl: { type: string }
        internalPathUrl: { type: string }
        deployedAt: { type: string, format: date-time }
        snapshotVersionId: { type: ["integer", "null"] }
        filesDeployed: { type: integer }
        containerDeployed: { type: boolean }
        prodContainerUrl: { type: ["string", "null"] }
        note: { type: string }

    ActivityItem:
      type: object
