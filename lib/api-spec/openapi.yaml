                raw: { type: string, maxLength: 60000 }
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                type: object
                required: [name, updated]
                properties:
                  name: { type: string }
                  updated: { type: boolean }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/skills/drafts/{name}/approve:
    post:
      operationId: approveAdminSkillDraft
