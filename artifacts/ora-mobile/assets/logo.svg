<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#7c3aed"/>

  <!-- Outer orbit ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="white" stroke-width="2" opacity="0.25"/>

  <!-- Inner orbit ring -->
  <circle cx="96" cy="96" r="48" fill="none" stroke="white" stroke-width="2" opacity="0.18"/>

  <!-- Electron 1 — top right of outer ring -->
  <circle cx="145" cy="57" r="7" fill="white" opacity="0.9"/>

  <!-- Electron 2 — bottom left of outer ring -->
  <circle cx="47" cy="135" r="6" fill="white" opacity="0.75"/>

  <!-- Electron 3 — bottom right of inner ring -->
  <circle cx="130" cy="130" r="5" fill="white" opacity="0.65"/>

  <!-- Nucleus core -->
  <circle cx="96" cy="96" r="24" fill="white" opacity="0.95"/>

  <!-- Nucleus highlight -->
  <circle cx="88" cy="88" r="8" fill="white" opacity="0.4"/>
</svg>
