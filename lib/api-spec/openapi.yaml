        status: { type: string }
        ownerId: { type: string }
        filesCount: { type: integer }
        secretsCopied: { type: boolean }
        note: { type: string }

    PublishResult:
      type: object
      required: [projectId, status, publicUrl, publishedAt, note]
      properties:
        projectId: { type: integer }
        status: { type: string }
        publicSlug: { type: string }
        publicUrl: { type: string }
        publishedAt: { type: string, format: date-time }
        note: { type: string }

    ActivityItem:
      type: object
      required: [id, projectId, projectName, kind, summary, createdAt]
      properties:
        id: { type: string }
        projectId: { type: integer }
        projectName: { type: string }
        kind:
          type: string
          enum: [message, task, version, project]
        summary: { type: string }
        createdAt: { type: string, format: date-time }

    ReadinessCheck:
      type: object
      required: [id, label, description, status, severity]
      properties:
        id: { type: string }
