            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: User and assistant messages persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatExchange"
  /projects/{id}/messages/stream/resume:
    get:
      operationId: resumeStream
      tags: [chat]
      summary: Resume a dropped SSE stream from a token offset
      description: |
        SSE resume endpoint. When a client loses the connection mid-stream it can
        reconnect here without restarting the AI call. The server replays only
        the buffered tokens the client has not yet received, then continues
        forwarding live tokens until the pipeline completes.

        The `sessionId` is received as the first `{"type":"session"}` event on
        the original `POST /projects/{id}/messages/stream` connection.
        `resumeAfterTokens` must equal the number of `token` events the client
        already processed.

        Event shapes emitted on the resumed stream:
        - `{"type":"token","content":"…"}` — replayed or new incremental chunk
        - `{"type":"done","userMessageId":N,"assistantMessageId":N,"plan":{…}}` — stream complete
        - `{"type":"error","message":"…"}` — something went wrong
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
          description: The streamSessionId from the initial session event.
        - name: resumeAfterTokens
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Number of token events already received; defaults to 0.
      responses:
        "200":
          description: >
            Server-Sent Events stream continuing from the given token offset.
          content:
            text/event-stream:
              schema:
                description: >
                  Each SSE `data:` line carries a JSON object. Discriminate on the `type`
                  field to determine the frame shape.
                oneOf:
                  - $ref: "#/components/schemas/StreamTokenEvent"
                  - $ref: "#/components/schemas/StreamDoneEvent"
                  - $ref: "#/components/schemas/StreamErrorEvent"
        "404":
          description: Session not found or expired (TTL is 10 minutes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/messages/stream:
    post:
      operationId: streamMessage
      tags: [chat]
      summary: Stream a conversational AI response over SSE (text/event-stream)
      description: |
        SSE endpoint for converse-family messages (converse, debug, refactor, review, explain).
        Streams OpenAI tokens word-by-word so the UI feels instant. The raw `fetch` + `ReadableStream`
        loop in the frontend is intentional — Orval cannot generate a TanStack Query hook for SSE.

        Event shapes emitted on the stream:
        - `{"type":"session","streamSessionId":"…"}` — first event; store this ID for use with the resume endpoint if the connection drops
        - `{"type":"token","content":"…"}` — incremental text chunk
        - `{"type":"done","userMessageId":N,"assistantMessageId":N,"plan":{…}}` — stream complete
        - `{"type":"fallback","intent":"build"|"plan"}` — not a converse message; client should re-send via `POST /projects/{id}/messages`
        - `{"type":"error","message":"…"}` — something went wrong
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: >
            Server-Sent Events stream. Each frame is a newline-delimited JSON object
            prefixed with "data:" and terminated by a blank line, per the SSE spec.
            The `type` field on each frame identifies its schema.
            NOTE: This endpoint is consumed via raw fetch + ReadableStream on the client;
            the generated Orval hook is intentionally not used (Orval cannot model SSE).
          content:
            text/event-stream:
              schema:
                description: >
                  Each SSE `data:` line carries a JSON object. Discriminate on the `type`
                  field to determine the frame shape.
                oneOf:
                  - $ref: "#/components/schemas/StreamSessionEvent"
                  - $ref: "#/components/schemas/StreamTokenEvent"
                  - $ref: "#/components/schemas/StreamDoneEvent"
                  - $ref: "#/components/schemas/StreamFallbackEvent"
                  - $ref: "#/components/schemas/StreamErrorEvent"
                discriminator:
                  propertyName: type
                  mapping:
                    session: "#/components/schemas/StreamSessionEvent"
                    token: "#/components/schemas/StreamTokenEvent"
                    done: "#/components/schemas/StreamDoneEvent"
                    fallback: "#/components/schemas/StreamFallbackEvent"
                    error: "#/components/schemas/StreamErrorEvent"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

