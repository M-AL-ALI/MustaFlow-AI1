              $ref: "#/components/schemas/AdminRoleInput"
      responses:
        "200":
          description: Role granted
          content:
            application/json:
              schema:
                type: object
                required: [ok, role]
                properties:
                  ok: { type: boolean }
                  role: { $ref: "#/components/schemas/AdminRole" }
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/roles/{userId}:
    delete:
      operationId: revokeAdminRole
      tags: [admin]
      summary: Revoke a role grant — user reverts to default "user" role
      parameters:
