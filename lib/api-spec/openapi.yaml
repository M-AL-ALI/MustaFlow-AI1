  # ── DNS record management ────────────────────────────────────────────────────

  /projects/{id}/domains/{domainId}/dns:
    get:
      operationId: listProjectDomainDnsRecords
      tags: [projects]
      summary: List Cloudflare DNS records for a custom domain
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: DNS record list
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/DnsRecord" }
        "404":
          description: Domain not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      operationId: createProjectDomainDnsRecord
      tags: [projects]
      summary: Create a DNS record for a custom domain
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsRecordInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [record]
                properties:
                  record: { $ref: "#/components/schemas/DnsRecord" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /projects/{id}/domains/{domainId}/dns/dry-run:
    post:
      operationId: dryRunProjectDomainDnsChanges
      tags: [projects]
      summary: Preview DNS diff without applying changes
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  items: { $ref: "#/components/schemas/DnsRecordInput" }
      responses:
        "200":
          description: Dry-run diff
          content:
            application/json:
              schema:
                type: object
                required: [enabled, diff]
                properties:
                  enabled: { type: boolean }
                  hostname: { type: string }
                  diff:
                    type: array
                    items: { $ref: "#/components/schemas/DnsRecordDiff" }

  /projects/{id}/domains/{domainId}/dns/history:
    get:
      operationId: getProjectDomainDnsHistory
      tags: [projects]
      summary: Fetch DNS change history for a custom domain
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Change history
          content:
            application/json:
              schema:
                type: object
                required: [hostname, history]
                properties:
                  hostname: { type: string }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/DnsHistoryEntry" }

  /projects/{id}/domains/{domainId}/dns/rollback:
    post:
      operationId: rollbackProjectDomainDnsChange
      tags: [projects]
      summary: Revert a DNS change using a history log entry ID (passed in body)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: domainId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logId]
              properties:
                logId: { type: integer }
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  rolled: { type: string }
                  cfRecordId: { type: string, nullable: true }
        "404":
          description: Log entry or record not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: Cloudflare rejected the rollback operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /projects/{id}/domains/{domainId}/dns/{recordId}:
    put:
      operationId: updateProjectDomainDnsRecord
