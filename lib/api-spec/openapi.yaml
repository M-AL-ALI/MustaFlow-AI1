                  testContainerStatus:
                    type: ["string", "null"]
                  containerUrl: { type: ["string", "null"] }
                  candidateVersionId: { type: ["integer", "null"] }
                  testedSnapshotId: { type: ["integer", "null"] }
                  migrationStatus: { type: ["string", "null"] }
                  previewSessionUrl: { type: ["string", "null"] }
        "404":
          {
            description: Project not found,
            content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } },
          }

