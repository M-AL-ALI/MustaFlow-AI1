openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MustaFlow AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: User projects (apps being built)
  - name: chat
    description: AI builder chat messages
  - name: tasks
    description: Background and main agent tasks
  - name: versions
    description: Project versions and rollback points
  - name: knowledge
    description: Knowledge Vault entries
  - name: secrets
    description: Project secrets (masked)
  - name: openai
    description: OpenAI AI chat operations
  - name: workspaces
    description: User workspaces (containers for projects)
  - name: credits
    description: User credits and billing
  - name: preferences
    description: Current user preferences (persisted to DB)
  - name: vault
    description: Knowledge Vault — user-controlled organizational knowledge repository
  - name: builds
    description: EAS mobile cloud builds (iOS / Android)
  - name: admin
    description: Admin-only platform management endpoints
  - name: billing
    description: Billing aliases and Stripe webhook
  - name: suggestions
    description: AI-generated post-build next-step suggestions
  - name: database
    description: Per-project database provisioning and query browser
  - name: storage
    description: Object storage upload and serving endpoints
  - name: images
    description: AI image generation for chat and project assets
  - name: checks
    description: AI-orchestrated quality and security check runs
  - name: security
    description: CVE dependency scanning and findings management
  - name: security-findings
    description: Persistent security findings across builds (dismiss/fix workflow)
  - name: v1
    description: Public stable REST API (v1) — accepts Bearer PAT token or session cookie
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /version:
    get:
      operationId: getServedBuildIdentity
      tags: [health]
      summary: Identity of the exact API build serving this request
      responses:
        "200":
          description: Build identity, or an honest unknown result when the build artifact is absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServedBuildIdentity"

  # POST /api/transcribe accepts a raw audio body (application/octet-stream) and
  # returns { text }. It is intentionally NOT declared in this OpenAPI spec because
  # Orval's generated client serialises bodies as JSON and would corrupt the audio.
  # Frontend calls it directly with `fetch(..., { body: blob })`.

  /projects/{id}/uploads/request-url:
    post:
      operationId: requestProjectUploadUrl
      tags: [storage]
      summary: Request a presigned PUT URL for a per-project upload.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                contentType: { type: string }
                size: { type: integer }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL: { type: string }
                  objectPath: { type: string }
        "413":
          description: Too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /projects/{id}/uploads:
    get:
      operationId: listProjectUploads
      tags: [storage]
      summary: List user-uploaded files attached to a project.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Uploads
          content:
            application/json:
              schema:
                type: object
                required: [uploads]
                properties:
                  uploads:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectUpload"
    post:
      operationId: registerProjectUpload
      tags: [storage]
      summary: Register an uploaded file after PUT to the presigned URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, objectPath]
              properties:
                name: { type: string }
                contentType: { type: string }
                sizeBytes: { type: integer }
                objectPath: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpload"

  /projects/{id}/uploads/{uploadId}:
    delete:
      operationId: deleteProjectUpload
      tags: [storage]
      summary: Delete a project upload by id.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: uploadId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /projects/{id}/attachments/upload-url:
    post:
      operationId: requestAttachmentUploadUrl
      tags: [storage]
      summary: Get a signed PUT URL for uploading a screenshot or image attachment (screenshot-to-code).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string }
      responses:
        "200":
          description: Signed upload URL and object path
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectPath]
                properties:
                  uploadUrl: { type: string }
                  objectPath: { type: string }
        "400":
          description: Bad request (non-image content type)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct file upload to GCS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /projects/{id}/security-findings:
    get:
      operationId: listSecurityFindings
      tags: [security-findings]
      summary: List persistent security findings for a project.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, dismissed, fixed]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low, info]
      responses:
        "200":
          description: Security findings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityFinding"

  /projects/{id}/security-findings/{findingId}/dismiss:
    post:
      operationId: dismissSecurityFinding
      tags: [security-findings]
      summary: Dismiss a security finding (moves it to the dismissed section).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: findingId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityFinding"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /security/findings:
    get:
      operationId: getAccountSecurityFindings
      tags: [security-findings]
      summary: Cross-project security findings for the authenticated user, sorted by exposure.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, dismissed, fixed]
      responses:
        "200":
          description: Account-level security findings with summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSecurityFindingsResponse"

  /security/badge:
    get:
      operationId: getSecurityBadgeCount
      tags: [security-findings]
      summary: Returns the count of open critical+high findings for the sidebar badge.
      responses:
        "200":
          description: Badge count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityBadgeCount"

  /security/badge/by-project:
    get:
      operationId: getSecurityBadgeCountsByProject
      tags: [security-findings]
      summary: Open critical+high findings counts per project for the authenticated user.
      responses:
        "200":
          description: Per-project badge counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityBadgeCountsByProject"

  /projects/{id}/test-runs:
    get:
      operationId: listTestRuns
      tags: [tests]
      summary: List persisted browser test run history for a project.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Test run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppTestRun"

  /projects/{id}/check-runs:
    get:
      operationId: getCheckRuns
      tags: [checks]
      summary: List check runs for a project, optionally filtered by taskId.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: query, required: false, schema: { type: integer } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 20 },
          }
      responses:
        "200":
          description: Check runs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckRun"

  /projects/{id}/check-runs/trends:
    get:
      operationId: getCheckRunTrends
      tags: [checks]
      summary: Return per-check status history for the last N builds (default 20).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - {
            name: window,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Quality trend series per check name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRunTrendsResponse"

  /projects/{id}/check-runs/trigger:
    post:
      operationId: triggerCheckRuns
      tags: [checks]
      summary: Manually trigger one or more checks (or a full on-demand security review).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerChecksInput"
      responses:
        "200":
          description: Triggered check run results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerChecksResult"

  /projects/{id}/health:
    get:
      operationId: getProjectHealth
      tags: [projects]
      summary: Get build health metrics for a project (success rate, latency percentiles, recent incidents).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project health metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHealthResponse"

  /security/cve:
    get:
      operationId: listCveFindings
      tags: [security]
      summary: List stored CVE findings from the last npm audit scan.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, dismissed, fixed]
      responses:
        "200":
          description: CVE findings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CveFinding"

  /security/cve/scan-status:
    get:
      operationId: getCveScanStatus
      tags: [security]
      summary: Get the last CVE scan timestamp and critical/high counts.
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CveScanStatus"

  /security/cve/scan-status/acknowledge:
    post:
      operationId: acknowledgeCveScan
      tags: [security]
      summary: Acknowledge new CVE findings so the notification badge clears.
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged]
                properties:
                  acknowledged: { type: boolean }

  /security/cve/scan:
    post:
      operationId: runCveScan
      tags: [security]
      summary: Trigger a fresh npm audit scan and upsert findings into the database.
      responses:
        "200":
          description: Scan complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CveScanResult"

  /security/cve/{id}/dismiss:
    patch:
      operationId: dismissCveFinding
      tags: [security]
      summary: Dismiss a specific CVE finding.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Finding dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CveFinding"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/developer-mode/runtime-status:
    get:
      operationId: getDeveloperModeRuntimeStatus
      tags: [projects]
      summary: Get the Developer Mode runtime status for a project (env vars, containerId, preflight result).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Runtime status table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperModeRuntimeStatus"
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /security/cve/{id}/apply-patch:
    post:
      operationId: applyCvePatch
      tags: [security]
      summary: Apply the prepared CVE auto-protect patch for a finding. Writes patched files to the project and records a version snapshot.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Patch applied — finding marked as fixed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CveFinding"
        "400":
          description: Patch not ready or no content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /security/sbom:
    get:
      operationId: downloadSbom
      tags: [security]
      summary: Download a CycloneDX SBOM listing all workspace dependencies for compliance audits.
      responses:
        "200":
          description: CycloneDX JSON SBOM document (attachment download)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomDocument"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: SBOM generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/generate-image:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate an image with gpt-image-1 and attach it to the project.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageInput"
      responses:
        "200":
          description: Generated image stored, returned as a chat attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResponse"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List user workspaces (auto-creates default if empty)
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema: { type: integer }
        - name: mode
          in: query
          required: false
          description: "Filter by project mode. 'builder' = AI Build Mode projects; 'developer' = Developer Mode cloud IDE projects."
          schema:
            type: string
            enum: [builder, developer]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /projects/trash:
    get:
      operationId: listTrashedProjects
      tags: [projects]
      summary: List soft-deleted projects for the current user (within 30-day recovery window)
      responses:
        "200":
          description: List of trashed projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{id}/restore:
    post:
      operationId: restoreProject
      tags: [projects]
      summary: Restore a soft-deleted project (clears deletedAt)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found or recovery window expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/summary:
    get:
      operationId: getProjectsSummary
      tags: [projects]
      summary: Dashboard aggregate counts
      responses:
        "200":
          description: Counts of projects by status and type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummary"

  /projects/{id}/checkpoints:
    get:
      operationId: listCheckpoints
      tags: [checkpoints]
      summary: Version History — file snapshot + linked DB snapshot per saved version
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Checkpoints for the project (most recent first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkpoint" }

  /projects/{id}/checkpoints/{checkpointId}/restore:
    post:
      operationId: restoreCheckpoint
      tags: [checkpoints]
      summary: Restore files and database to a saved version while preserving chat and appending forward-only safety checkpoints.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: checkpointId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Restore complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointRestoreResponse"

  /projects/{id}/visual-edit:
    post:
      operationId: visualEdit
      tags: [preview]
      summary: Click-to-edit preview — applies a direct patch for simple static-html text edits, otherwise returns a refine prompt for the agent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualEditInput"
      responses:
        "200":
          description: Edit processed (patched directly or fell back to a prompt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualEditResult"

  /projects/{id}/workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List named workflows declared in workflows.yaml (or per-stack defaults)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Workflow definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"

  /projects/{id}/workflows/{name}/run:
    post:
      operationId: runWorkflow
      tags: [workflows]
      summary: Execute a named workflow in the project container
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Workflow ran (check `ok` for success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunResponse"
        "404":
          description: Workflow not found
        "409":
          description: Project container is not running

  /projects/{id}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Messages in builder chat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to the AI builder. Returns the saved user + assistant messages.
      parameters:
