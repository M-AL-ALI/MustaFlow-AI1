          content:
            application/json:
              schema:
                type: object
                required: [ok, userId]
                properties:
                  ok: { type: boolean }
                  userId: { type: string }
                  note: { type: string }

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
